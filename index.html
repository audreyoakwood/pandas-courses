<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F3FF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E0B1F" media="(prefers-color-scheme: dark)">
<meta name="description" content="Budget courses partagé et liste de courses pour Audrey & Tom">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PandaCourses">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>PandaCourses — Audrey & Tom</title>
<link rel="preload" href="fonts/outfit-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face { font-family: 'Outfit'; font-style: normal; font-weight: 300 800; font-display: swap; src: url(fonts/outfit-latin.woff2) format('woff2'); }
  :root {
    --bg: #F6F3FF;
    --ink: #1D1838;
    --ink-2: #6A6585;
    --ink-3: #A8A3C0;
    --glass: rgba(255,255,255,0.62);
    --glass-2: rgba(255,255,255,0.42);
    --glass-line: rgba(255,255,255,0.85);
    --line: rgba(29,24,56,0.08);
    --field: rgba(29,24,56,0.06);
    --audrey: #6C5CFF;
    --audrey-soft: #ECEAFF;
    --tom: #FF7A4D;
    --tom-soft: #FFEDE5;
    --pos: #12A579;
    --pos-soft: rgba(18,165,121,0.14);
    --neg: #F0466E;
    --neg-soft: rgba(240,70,110,0.12);
    --star: #FFB020;
    --grad: linear-gradient(120deg, #6C5CFF 0%, #B154F5 50%, #FF6F91 100%);
    --grad-soft: linear-gradient(120deg, rgba(108,92,255,0.14), rgba(255,111,145,0.14));
    --glow: 0 10px 30px rgba(124,84,255,0.35);
    --sh: 0 2px 12px rgba(60,40,140,0.06);
    --sh-lg: 0 14px 44px rgba(60,40,140,0.18);
    --r: 26px; --r-sm: 18px;
    --tabbar: 68px;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
    --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    --seg-on: #FFFFFF; --key-press: rgba(255,255,255,0.95);
    --b1: #C7B9FF; --b2: #FFC2A8; --b3: #A9EEDC; --b4: #B4D4FF;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0E0B1F; --ink: #F3F1FF; --ink-2: #ABA5C8; --ink-3: #6C668C;
      --glass: rgba(34,28,66,0.55); --glass-2: rgba(34,28,66,0.38); --glass-line: rgba(255,255,255,0.08);
      --line: rgba(255,255,255,0.08); --field: rgba(255,255,255,0.07);
      --audrey: #8F83FF; --audrey-soft: #2A2560; --tom: #FF9670; --tom-soft: #47271D;
      --sh: 0 2px 12px rgba(0,0,0,0.25); --sh-lg: 0 14px 44px rgba(0,0,0,0.5);
      --seg-on: rgba(255,255,255,0.16); --key-press: rgba(255,255,255,0.14);
      --b1: #4B33B8; --b2: #8A3A4E; --b3: #13665A; --b4: #2A4A9A;
    }
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--bg); }
  body {
    font-family: 'Outfit', -apple-system, 'Segoe UI', system-ui, sans-serif;
    color: var(--ink); background: transparent;
    max-width: 430px; margin: 0 auto; min-height: 100vh; min-height: 100dvh;
    -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  }
  button { font-family: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  input, select { font-family: inherit; color: var(--ink); }
  .num { font-variant-numeric: tabular-nums; }

  /* Fond fluide : taches de couleur floues qui dérivent lentement */
  .aurora { position: fixed; inset: 0; overflow: hidden; z-index: -1; pointer-events: none; }
  .aurora i { position: absolute; width: 70vmax; height: 70vmax; border-radius: 50%; filter: blur(70px); opacity: 0.75; animation: drift 22s ease-in-out infinite alternate; }
  .aurora i:nth-child(1) { background: var(--b1); top: -30vmax; left: -20vmax; }
  .aurora i:nth-child(2) { background: var(--b2); top: -10vmax; right: -35vmax; animation-delay: -6s; animation-duration: 26s; }
  .aurora i:nth-child(3) { background: var(--b3); bottom: -35vmax; left: -25vmax; animation-delay: -12s; animation-duration: 30s; }
  .aurora i:nth-child(4) { background: var(--b4); bottom: -30vmax; right: -30vmax; animation-delay: -3s; }
  @keyframes drift { from { transform: translate(0,0) scale(1); } to { transform: translate(6vmax, 8vmax) scale(1.15); } }
  @media (prefers-reduced-motion: reduce) { .aurora i { animation: none; } }
  .glass, .me, .amount-cap, .chip, .other-in, .date-in, .seg, .key, .ycard, .month, .add input, .g-body, .tabbar { background: var(--glass); backdrop-filter: blur(22px) saturate(1.5); -webkit-backdrop-filter: blur(22px) saturate(1.5); border: 1px solid var(--glass-line); box-shadow: var(--sh); }

  @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  @keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.07); } 100% { transform: scale(1); } }
  .view { display: none; padding: 0 16px calc(var(--tabbar) + 44px + env(safe-area-inset-bottom)); }
  .view.active { display: block; animation: rise 0.45s var(--ease); }

  /* En-tête */
  .top { display: flex; align-items: center; justify-content: space-between; padding: 12px 2px 12px; padding-top: calc(12px + env(safe-area-inset-top)); }
  .top h1 { font-size: 2rem; font-weight: 700; letter-spacing: -0.035em; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-logo { width: 38px; height: 38px; border-radius: 13px; overflow: hidden; box-shadow: var(--sh-lg); }
  .brand-logo svg { display: block; width: 100%; height: 100%; }
  .me { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; font-weight: 500; padding: 5px 14px 5px 5px; border-radius: 30px; }
  .me .av { width: 28px; height: 28px; font-size: 0.78rem; }
  .sub { font-size: 0.9rem; color: var(--ink-2); font-weight: 400; }

  .av { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 50%; color: #fff; font-weight: 600; font-size: 0.9rem; flex-shrink: 0; }
  .av.a { background: linear-gradient(135deg, #8A7DFF, #5B4BFF); } .av.t { background: linear-gradient(135deg, #FFA06F, #FF6A4D); }
  .av.q { background: var(--field); color: var(--ink-2); }

  /* ── Saisir : équilibre (carte colorée) ── */
  .bal { display: block; width: 100%; text-align: left; color: #fff; background: var(--grad); border-radius: var(--r); padding: 18px 18px 15px; box-shadow: var(--glow); position: relative; overflow: hidden; transition: transform 0.3s var(--spring); }
  .bal::before { content: ''; position: absolute; width: 220px; height: 220px; border-radius: 50%; background: rgba(255,255,255,0.16); top: -120px; right: -60px; }
  .bal::after { content: ''; position: absolute; width: 160px; height: 160px; border-radius: 50%; background: rgba(255,255,255,0.10); bottom: -110px; left: -40px; }
  .bal > * { position: relative; z-index: 1; }
  .bal:active { transform: scale(0.98); }
  .bal-top { display: flex; align-items: center; gap: 12px; }
  .bal .av { box-shadow: 0 0 0 3px rgba(255,255,255,0.35); }
  .bal-mid { flex: 1; min-width: 0; text-align: center; }
  .bal-cap { font-size: 0.85rem; font-weight: 400; opacity: 0.85; }
  .bal-amt { font-size: 2rem; font-weight: 700; letter-spacing: -0.035em; line-height: 1.15; }
  .bal-ok { font-size: 1.2rem; font-weight: 600; margin-top: 2px; }
  .bal-bar { display: flex; gap: 4px; height: 7px; margin: 14px 0 9px; }
  .bal-bar div { border-radius: 4px; transition: width 0.6s var(--ease); }
  .bal-bar .a { background: #fff; } .bal-bar .t { background: rgba(255,255,255,0.45); } .bal-bar .z { flex: 1; background: rgba(255,255,255,0.3); }
  .bal-legend { display: flex; justify-content: space-between; font-size: 0.82rem; font-weight: 400; opacity: 0.92; }
  .bal-legend b { font-weight: 600; }
  .bal .dot.a { background: #fff; } .bal .dot.t { background: rgba(255,255,255,0.5); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .dot.a { background: var(--audrey); } .dot.t { background: var(--tom); }

  /* ── Saisir : composeur ── */
  .composer { margin-top: 8px; }
  .edit-banner { display: none; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 8px 8px 14px; margin-bottom: 6px; border-radius: var(--r-sm); background: var(--grad-soft); font-size: 0.88rem; font-weight: 500; }
  .edit-banner.on { display: flex; animation: rise 0.3s var(--ease); }
  .edit-banner .acts { display: flex; gap: 4px; }
  .edit-banner button { font-size: 0.82rem; font-weight: 600; padding: 7px 12px; border-radius: 12px; background: var(--glass); }
  .edit-banner .del { color: var(--neg); }
  .amount { display: flex; flex-direction: column; align-items: center; padding: 4px 0 8px; }
  .amount-val { display: inline-block; font-size: 3.6rem; font-weight: 600; letter-spacing: -0.05em; line-height: 1.05; }
  .amount-val.zero { color: var(--ink-3); font-weight: 300; }
  .amount-val.bump { animation: pop 0.25s var(--spring); }
  .amount-cap { display: inline-flex; align-items: center; gap: 7px; font-size: 0.86rem; font-weight: 500; color: var(--ink-2); margin-top: 8px; padding: 4px 13px 4px 4px; border-radius: 20px; }
  .amount-cap .av { width: 22px; height: 22px; font-size: 0.64rem; }

  .chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px -6px; padding: 4px 16px 14px; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex-shrink: 0; display: inline-flex; align-items: center; gap: 7px; font-size: 0.95rem; font-weight: 500; padding: 9px 16px 9px 12px; border-radius: 30px; white-space: nowrap; transition: transform 0.35s var(--spring), background 0.2s, color 0.2s, box-shadow 0.2s; }
  .chip:active { transform: scale(0.92); }
  .chip .e { font-size: 1.1rem; line-height: 1; }
  .chip.on { background: var(--grad); color: #fff; border-color: transparent; box-shadow: 0 4px 12px rgba(124,84,255,0.32); }
  .other-in, .date-in { display: none; width: 100%; margin-top: 8px; padding: 13px 16px; border-radius: var(--r-sm); font-size: 1rem; outline: none; }
  .other-in.on, .date-in.on { display: block; animation: rise 0.3s var(--ease); }
  .other-in:focus { box-shadow: 0 0 0 2px var(--audrey); }

  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .seg { display: flex; border-radius: 18px; padding: 4px; }
  .seg button { flex: 1; font-size: 0.92rem; font-weight: 500; padding: 9px 4px; border-radius: 14px; color: var(--ink-2); white-space: nowrap; transition: background 0.3s var(--ease), color 0.3s, box-shadow 0.3s; }
  .seg button.on { background: var(--seg-on); color: var(--ink); box-shadow: 0 2px 8px rgba(60,40,140,0.12); }
  .seg.payer button.on.a { background: linear-gradient(135deg, #8A7DFF, #5B4BFF); color: #fff; }
  .seg.payer button.on.t { background: linear-gradient(135deg, #FFA06F, #FF6A4D); color: #fff; }

  .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; margin-top: 12px; }
  .key { height: 50px; border-radius: 20px; font-size: 1.55rem; font-weight: 400; display: flex; align-items: center; justify-content: center; user-select: none; -webkit-user-select: none; transition: transform 0.25s var(--spring), background 0.15s; }
  .key:active { transform: scale(0.9); background: var(--key-press); }
  .key.fn { background: transparent; border-color: transparent; box-shadow: none; backdrop-filter: none; -webkit-backdrop-filter: none; color: var(--ink-2); }
  .save { width: 100%; margin-top: 10px; padding: 16px; border-radius: 22px; background: var(--grad); background-size: 160% 100%; color: #fff; font-size: 1.1rem; font-weight: 600; letter-spacing: -0.01em; box-shadow: var(--glow); transition: transform 0.3s var(--spring), background-position 0.6s var(--ease), opacity 0.2s; }
  .save:active:not(:disabled) { transform: scale(0.96); background-position: 100% 0; }
  .save:disabled { background: var(--field); color: var(--ink-3); box-shadow: none; cursor: default; }

  /* ── Journal ── */
  .ycard { border-radius: var(--r); padding: 18px 16px 12px; }
  .ycard-head { display: flex; justify-content: space-between; align-items: flex-start; }
  .ycard-total { font-size: 2.3rem; font-weight: 600; letter-spacing: -0.045em; line-height: 1.1; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .ycard-avg { text-align: right; padding: 8px 12px; border-radius: 14px; background: var(--grad-soft); font-size: 0.78rem; color: var(--ink-2); line-height: 1.35; }
  .ycard-avg b { display: block; color: var(--ink); font-size: 1.05rem; font-weight: 600; }
  .bars { display: flex; align-items: flex-end; gap: 5px; height: 80px; margin-top: 16px; }
  .bars button { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 6px; }
  .bars .b { width: 100%; border-radius: 8px; background: linear-gradient(180deg, rgba(108,92,255,0.35), rgba(255,111,145,0.25)); min-height: 4px; transition: height 0.7s var(--ease); }
  .bars .b.cur { background: var(--grad); box-shadow: var(--glow); }
  .bars .l { font-size: 0.66rem; font-weight: 500; color: var(--ink-3); }

  .month { margin-top: 12px; border-radius: var(--r); overflow: hidden; animation: rise 0.5s var(--ease) both; }
  .m-head { display: block; width: 100%; text-align: left; padding: 15px 16px; cursor: pointer; }
  .m-row { display: flex; justify-content: space-between; align-items: center; }
  .m-name { font-size: 1.2rem; font-weight: 600; letter-spacing: -0.02em; }
  .m-name .chev { display: inline-block; color: var(--ink-3); margin-left: 6px; font-size: 0.95rem; transition: transform 0.4s var(--spring); }
  .month.open .m-name .chev { transform: rotate(90deg); }
  .m-total { font-size: 1.2rem; font-weight: 600; letter-spacing: -0.02em; }
  .m-meta { display: flex; justify-content: space-between; align-items: center; margin-top: 7px; font-size: 0.88rem; color: var(--ink-2); gap: 8px; }
  .m-who { display: inline-flex; align-items: center; gap: 6px; }
  .m-who .av { width: 22px; height: 22px; font-size: 0.62rem; }
  .vir { font-size: 0.8rem; font-weight: 600; padding: 7px 13px; border-radius: 20px; white-space: nowrap; transition: transform 0.3s var(--spring); }
  .vir:active { transform: scale(0.92); }
  .vir.todo { color: #fff; background: linear-gradient(120deg, #FF6F91, #FF8A5B); box-shadow: 0 6px 18px rgba(255,111,145,0.35); }
  .vir.done { color: var(--pos); background: var(--pos-soft); }
  .vir.cur { color: var(--ink-2); background: var(--field); cursor: default; }
  .m-body { display: none; padding-bottom: 4px; }
  .month.open .m-body { display: block; animation: rise 0.35s var(--ease); }
  .day { padding: 10px 16px 4px; font-size: 0.78rem; font-weight: 500; color: var(--ink-3); }
  .row { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 8px 16px; transition: background 0.2s; }
  .row.ed:active { background: var(--glass-2); }
  .row-ic { position: relative; width: 44px; height: 44px; border-radius: 16px; background: var(--grad-soft); display: flex; align-items: center; justify-content: center; font-size: 1.35rem; flex-shrink: 0; }
  .row-ic .av { position: absolute; right: -4px; bottom: -4px; width: 19px; height: 19px; font-size: 0.56rem; box-shadow: 0 0 0 2px var(--bg); }
  .row-main { flex: 1; min-width: 0; }
  .row-name { font-size: 1rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row-who { font-size: 0.8rem; color: var(--ink-2); }
  .row-amt { font-size: 1.02rem; font-weight: 600; }
  .m-foot { display: flex; gap: 14px; padding: 8px 16px 14px; font-size: 0.8rem; font-weight: 500; color: var(--ink-2); flex-wrap: wrap; }
  .m-hint { color: var(--ink-3); font-weight: 400; }

  /* ── Liste ── */
  .add { display: flex; gap: 8px; }
  .add input { flex: 1; min-width: 0; padding: 15px 18px; border-radius: 20px; font-size: 1rem; outline: none; }
  .add input:focus { box-shadow: 0 0 0 2px var(--audrey); }
  .add button { width: 54px; border-radius: 20px; background: var(--grad); color: #fff; font-size: 1.6rem; font-weight: 300; box-shadow: var(--glow); transition: transform 0.3s var(--spring); }
  .add button:active { transform: scale(0.9) rotate(90deg); }
  .add-stores { margin-top: 10px; }
  .add-stores .chip { font-size: 0.86rem; padding: 7px 13px 7px 10px; }
  .group { margin-top: 18px; animation: rise 0.5s var(--ease) both; }
  .g-head { display: flex; justify-content: space-between; align-items: center; padding: 0 4px 8px; }
  .g-name { display: inline-flex; align-items: center; gap: 8px; font-size: 1.05rem; font-weight: 600; letter-spacing: -0.01em; }
  .g-name .e { font-size: 1.15rem; }
  .g-count { min-width: 26px; height: 26px; padding: 0 9px; border-radius: 13px; background: var(--grad); color: #fff; font-size: 0.8rem; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; }
  .g-body { border-radius: var(--r); overflow: hidden; }
  .it { display: flex; align-items: center; gap: 12px; padding: 0 8px 0 15px; min-height: 54px; }
  .it + .it { border-top: 1px solid var(--line); }
  .it-check { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--ink-3); flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: #fff; transition: background 0.3s, border-color 0.3s, transform 0.4s var(--spring); }
  .it-check:active { transform: scale(0.8); }
  .it.done .it-check { background: linear-gradient(135deg, #2ACB97, #12A579); border-color: transparent; }
  .it-text { flex: 1; min-width: 0; font-size: 1.02rem; padding: 14px 0; word-break: break-word; text-align: left; }
  .it.done .it-text { color: var(--ink-3); text-decoration: line-through; }
  .it-star { font-size: 1.2rem; color: var(--ink-3); opacity: 0.4; padding: 8px 6px; transition: transform 0.4s var(--spring), color 0.2s, opacity 0.2s; }
  .it-star.on { color: var(--star); opacity: 1; transform: scale(1.15); }
  .it-del { font-size: 0.9rem; color: var(--ink-3); padding: 8px; }
  .basket-head { display: flex; justify-content: space-between; align-items: center; margin-top: 24px; padding: 0 4px 8px; }
  .basket-head .g-name { color: var(--ink-2); }
  .basket-head button { font-size: 0.82rem; font-weight: 600; color: var(--neg); padding: 7px 12px; border-radius: 12px; background: var(--neg-soft); }
  .empty { text-align: center; color: var(--ink-2); font-size: 1rem; padding: 48px 20px; line-height: 1.55; }
  .empty .big { display: block; font-size: 2.8rem; margin-bottom: 10px; }

  /* ── Barre d'onglets flottante ── */
  .tabbar { position: fixed; left: 50%; bottom: calc(12px + env(safe-area-inset-bottom)); transform: translateX(-50%); width: calc(100% - 32px); max-width: 398px; height: var(--tabbar); display: flex; padding: 6px; gap: 4px; border-radius: 26px; z-index: 10; box-shadow: var(--sh-lg); }
  .tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 20px; font-size: 0.74rem; font-weight: 500; color: var(--ink-2); position: relative; transition: background 0.4s var(--ease), color 0.3s, box-shadow 0.4s; }
  .tab svg { width: 22px; height: 22px; }
  .tab.on { color: #fff; background: var(--grad); box-shadow: var(--glow); }
  .badge { position: absolute; top: 5px; left: calc(50% + 8px); min-width: 19px; height: 19px; padding: 0 5px; border-radius: 10px; background: var(--tom); color: #fff; font-size: 0.66rem; font-weight: 700; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 2px var(--bg); }
  .badge[hidden] { display: none; }

  /* ── Toast & feuille ── */
  .toast { position: fixed; left: 50%; bottom: calc(var(--tabbar) + 26px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px) scale(0.94); opacity: 0; pointer-events: none; width: calc(100% - 32px); max-width: 398px; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 13px 14px 13px 16px; border-radius: 20px; background: rgba(29,24,56,0.92); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); color: #fff; font-size: 0.95rem; font-weight: 500; box-shadow: var(--sh-lg); transition: opacity 0.25s, transform 0.45s var(--spring); z-index: 20; }
  .toast.on { opacity: 1; transform: translate(-50%, 0) scale(1); pointer-events: auto; }
  .toast span::before { content: '✓'; display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; margin-right: 10px; border-radius: 50%; background: linear-gradient(135deg, #2ACB97, #12A579); color: #fff; font-size: 0.72rem; }

  {id:85,store:'Leclerc',amount:40,partner:1,date:'2026-09-19'},{id:86,store:'Bioveyre',amount:35,partner:0,date:'2026-09-21'},
];

// Version des données importées depuis le Google Sheet : à incrémenter à chaque nouvel import
const SEED_V=2;
let st={exp:[...SEED],vir:{0:true,1:true,2:true,3:true,4:true,5:true,6:true},nextId:87,seedV:SEED_V,sel:0,vm:6,list:[],listId:1};
let editId=null;

function save(){localStorage.setItem('pandacourses',JSON.stringify(st));}
function load(){const d=localStorage.getItem('pandacourses');if(d)st=JSON.parse(d);if(!st.list)st.list=[];if(!st.listId)st.listId=1;mergeSeed();}
// Ajoute aux données déjà enregistrées les dépenses du Sheet qui n'y sont pas encore
function mergeSeed(){
  if((st.seedV||1)>=SEED_V)return;
  const k=e=>e.date+'|'+e.store+'|'+e.amount+'|'+e.partner,have=new Set(st.exp.map(k));
  SEED.forEach(e=>{if(!have.has(k(e))){st.exp.push({...e,id:st.nextId++});have.add(k(e));}});
  [4,5,6].forEach(i=>{if(st.vir[i]===undefined)st.vir[i]=true;});
  st.seedV=SEED_V;save();
}

// ── Outils ──
function cm(){return new Date().getMonth();}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function today(){return iso(new Date());}
function yesterday(){const d=new Date();d.setDate(d.getDate()-1);return iso(d);}
function monExp(m){const k=String(m+1).padStart(2,'0');return st.exp.filter(e=>e.date.slice(5,7)===k);}
function pTot(m,p){return monExp(m).filter(e=>e.partner===p).reduce((s,e)=>s+e.amount,0);}
function eq(m){const a=pTot(m,0),t=pTot(m,1),tot=a+t;return{a,t,tot,d:a-tot/2};}
function fs(n){return Math.round(n*100)%100===0?Math.round(n)+' €':n.toFixed(2).replace('.',',')+' €';}
function abbr(s){if(ABBR[s])return ABBR[s];if(s.includes(','))return s.split(',').map(x=>ABBR[x.trim()]||x.trim().slice(0,2).toUpperCase()).join('/');return s.slice(0,3).toUpperCase();}
function pc(p){return p===0?'a':'t';}
const EMOJI={'Bioveyre':'🥬','Carrefour':'🛒','Picard':'🧊','Malongo':'☕','Leclerc':'🏬','Biocoop':'🌱','Autres':'🧾','Set Squash':'🎾','Parapharmacie':'💊'};
function emo(s){if(EMOJI[s])return EMOJI[s];const f=String(s).split(',')[0].trim();return EMOJI[f]||'🧾';}
function av(p){return p===null||p===undefined?'<span class="av q">?</span>':`<span class="av ${pc(p)}">${P[p][0]}</span>`;}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function dayLabel(ds){const d=new Date(ds+'T12:00');const s=d.toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'});return ds===today()?"Aujourd'hui":ds===yesterday()?'Hier':s;}
// Phrase d'équilibre : d>0 → Audrey a payé plus, Tom lui doit d
function owes(d){if(Math.abs(d)<0.01)return null;return d>0?{from:'Tom',to:'Audrey',amt:d}:{from:'Audrey',to:'Tom',amt:-d};}

// ── Qui utilise ce téléphone (propre à chaque appareil) ──
let me=null;
try{const v=localStorage.getItem('pandacourses-me');if(v==='0'||v==='1')me=+v;}catch(e){}
function openWho(){document.getElementById('who-sheet').classList.add('on');}
function setMe(p){me=p;try{localStorage.setItem('pandacourses-me',String(p));}catch(e){}document.getElementById('who-sheet').classList.remove('on');if(editId===null)c.payer=p;rSaisir();}

// ── Navigation ──
let view='saisir';
function go(v){
  view=v;
  document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id==='v-'+v));
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  if(v==='saisir')rSaisir();if(v==='journal')rJournal();if(v==='liste')rList();
  window.scrollTo(0,0);
}

// ── Saisir ──
const c={amt:'',store:null,other:'',payer:0,dmode:'today',date:today()};
function storeOrder(){
  const n={};st.exp.forEach(e=>{n[e.store]=(n[e.store]||0)+1;});
  return KNOWN.filter(s=>s!=='Autres').sort((a,b)=>(n[b]||0)-(n[a]||0));
}
function amtNum(){return c.amt?parseFloat(c.amt.replace(',','.')):0;}
function rBal(){
  const m=cm(),e=eq(m),o=owes(e.d);
  const mid=o?`<div class="bal-cap">${o.from} doit à ${o.to}</div><div class="bal-amt num">${fs(o.amt)}</div>`
    :`<div class="bal-cap">${MONTHS[m]}</div><div class="bal-ok">${e.tot?'Tout est carré 👌':'Aucune dépense pour l\'instant'}</div>`;
  const bar=e.tot?`<div class="a" style="width:${e.a/e.tot*100}%"></div><div class="t" style="width:${e.t/e.tot*100}%"></div>`:'<div class="z"></div>';
  document.getElementById('bal').innerHTML=`
    <div class="bal-top">${o?av(o.from==='Audrey'?0:1):av(0)}<div class="bal-mid">${mid}</div>${o?av(o.to==='Audrey'?0:1):av(1)}</div>
    <div class="bal-bar">${bar}</div>
    <div class="bal-legend num"><span><span class="dot a"></span><b>${fs(e.a)}</b></span><span>${fs(e.tot)} en ${MONTHS[m].toLowerCase()} ›</span><span><b>${fs(e.t)}</b><span class="dot t" style="margin:0 0 0 6px"></span></span></div>`;
}
function rAmt(){
  const el=document.getElementById('amt-val');
  el.textContent=(c.amt||'0')+' €';el.classList.toggle('zero',!c.amt);
  el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump');
}
function rCap(){
  const d=c.dmode==='other'?document.getElementById('date-in').value:c.date;
  document.getElementById('amt-cap').innerHTML=`${av(c.payer)}${d?dayLabel(d):'Date à choisir'} · ${P[c.payer]}`;
  rSave();
}
function rStores(){
  const chips=storeOrder().map(s=>`<button class="chip ${c.store===s?'on':''}" onclick="pickStore('${s}')"><span class="e">${emo(s)}</span>${s}</button>`).join('')
    +`<button class="chip ${c.store==='__other'?'on':''}" onclick="pickStore('__other')"><span class="e">✏️</span>Autre…</button>`;
  document.getElementById('store-chips').innerHTML=chips;
  document.getElementById('other-in').classList.toggle('on',c.store==='__other');
}
function rPayer(){
  document.getElementById('payer').innerHTML=P.map((n,i)=>`<button class="${pc(i)} ${c.payer===i?'on':''}" onclick="c.payer=${i};rPayer();rCap()">${n}</button>`).join('');
}
function rDate(){
  const opts=[['today','Auj.'],['yesterday','Hier'],['other','Autre']];
  document.getElementById('dseg').innerHTML=opts.map(([k,l])=>`<button class="${c.dmode===k?'on':''}" onclick="pickDate('${k}')">${l}</button>`).join('');
  document.getElementById('date-in').classList.toggle('on',c.dmode==='other');
}
function rKeypad(){
  const k=['1','2','3','4','5','6','7','8','9',',','0','⌫'];
  document.getElementById('keypad').innerHTML=k.map(x=>`<button class="key ${x===','||x==='⌫'?'fn':''}" onclick="press('${x}')">${x}</button>`).join('');
}
function rSave(){
  const b=document.getElementById('save'),n=amtNum();
  const storeOk=c.store&&(c.store!=='__other'||document.getElementById('other-in').value.trim());
  const dateOk=c.dmode!=='other'||document.getElementById('date-in').value;
  b.disabled=!(n>0&&storeOk&&dateOk);
  b.textContent=!n?'Saisir un montant':!storeOk?'Choisir un magasin':!dateOk?'Choisir une date':editId!==null?'Enregistrer les modifications':`Enregistrer ${fs(n)}`;
}
function rSaisir(){
  document.getElementById('me-btn').innerHTML=me===null?`${av(null)}Qui êtes-vous ?`:`${av(me)}${P[me]}`;
  rBal();rAmt();rStores();rPayer();rDate();rCap();
}
function press(k){
  let a=c.amt;
  if(k==='⌫')a=a.slice(0,-1);
  else if(k===','){if(!a.includes(','))a=(a||'0')+',';}
  else{
    if(a.includes(',')&&a.split(',')[1].length>=2)return;
    if(a.replace(',','').length>=6)return;
    a=(a==='0'?'':a)+k;
  }
  c.amt=a;rAmt();rSave();
}
function pickStore(s){c.store=s;rStores();if(s==='__other')document.getElementById('other-in').focus();rSave();}
function pickDate(k){
  c.dmode=k;
  if(k==='today')c.date=today();else if(k==='yesterday')c.date=yesterday();
  else{const di=document.getElementById('date-in');if(!di.value)di.value=today();}
  rDate();rCap();
}
function resetComposer(){
  c.amt='';c.store=null;c.payer=me??0;c.dmode='today';c.date=today();
  document.getElementById('other-in').value='';document.getElementById('date-in').value='';
  editId=null;document.getElementById('edit-banner').classList.remove('on');
}
function submitExp(){
  const n=amtNum();if(!(n>0)||!c.store)return;
  const date=c.dmode==='other'?document.getElementById('date-in').value:c.date;if(!date)return;
  const otherTxt=document.getElementById('other-in').value.trim();
  let store=c.store,comment;
  if(store==='__other'){store='Autres';comment=otherTxt;}
  if(editId!==null){
    const e=st.exp.find(x=>x.id===editId);
    // Un magasin hors liste (ex. « Carrefour, Bioveyre ») resté inchangé garde son nom d'origine
    if(e&&c.store==='__other'&&!KNOWN.includes(e.store)&&otherTxt===e.store){store=e.store;comment=e.comment;}
    if(e){e.store=store;e.amount=n;e.date=date;e.partner=c.payer;if(comment)e.comment=comment;else delete e.comment;}
    save();resetComposer();rSaisir();toast('Dépense modifiée');go('journal');return;
  }
  const e={id:st.nextId++,store,amount:n,date,partner:c.payer};if(comment)e.comment=comment;
  st.exp.push(e);save();
  const label=comment||store;
  resetComposer();rSaisir();
  toast(`${fs(n)} · ${label} ajouté`,()=>{st.exp=st.exp.filter(x=>x.id!==e.id);save();rSaisir();});
}

// Modifier : seules les dépenses du mois en cours sont modifiables

function openEdit(id){
  const e=st.exp.find(x=>x.id===id);if(!e)return;
  editId=id;
  c.amt=String(e.amount).replace('.',',');c.payer=e.partner;
  const t=e.date===today()?'today':e.date===yesterday()?'yesterday':'other';
  c.dmode=t;c.date=e.date;document.getElementById('date-in').value=t==='other'?e.date:'';
  if(KNOWN.includes(e.store)&&e.store!=='Autres'){c.store=e.store;document.getElementById('other-in').value='';}
  else{c.store='__other';document.getElementById('other-in').value=e.store==='Autres'?(e.comment||''):e.store;}
  document.getElementById('edit-label').textContent=`${emo(e.store)} Modifier · ${e.store} · ${dayLabel(e.date).toLowerCase()}`;
  document.getElementById('edit-banner').classList.add('on');
  go('saisir');
}
function cancelEdit(){resetComposer();rSaisir();go('journal');}
function delEditing(){
  if(editId===null)return;
  const e=st.exp.find(x=>x.id===editId);
  st.exp=st.exp.filter(x=>x.id!==editId);save();resetComposer();rSaisir();
  toast('Dépense supprimée',()=>{st.exp.push(e);save();rJournal();});
  go('journal');
}

// ── Journal ──
const openM=new Set([cm()]);
function rJournal(){
  const now=cm(),tots=MONTHS.map((_,i)=>eq(i).tot),yr=tots.reduce((s,v)=>s+v,0),mx=Math.max(...tots,1);
  document.getElementById('ycard').innerHTML=`
    <div class="ycard-head"><div><div class="sub">Dépensé depuis janvier</div><div class="ycard-total num">${fs(yr)}</div></div>
      <div class="ycard-avg">Moyenne<b class="num">${fs(Math.round(yr/(now+1)))}</b>par mois</div></div>
    <div class="bars">${tots.map((v,i)=>`<button onclick="jump(${i})" ${i>now?'disabled':''} aria-label="${MONTHS[i]}"><div class="b ${i===now?'cur':''}" style="height:${i>now?0:Math.max(v/mx*100,3)}%"></div><span class="l">${MSHORT[i][0]}</span></button>`).join('')}</div>`;
  let h='';
  for(let i=now;i>=0;i--){
    const ex=monExp(i);if(!ex.length&&i!==now)continue;
    const e=eq(i),o=owes(e.d),cur=i===now;
    const pill=!o?'':cur?'<span class="vir cur">en cours</span>':`<button class="vir ${st.vir[i]?'done':'todo'}" onclick="event.stopPropagation();tglV(${i})">${st.vir[i]?'✓ Virement fait':'Virement à faire'}</button>`;
    const days={};ex.sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id).forEach(x=>{(days[x.date]=days[x.date]||[]).push(x);});
    const body=Object.keys(days).map(d=>`<div class="day">${dayLabel(d)}</div>`+days[d].map(x=>{
      const nm=esc(x.comment?`${x.store==='Autres'?'':x.store+' — '}${x.comment}`:x.store);
      return `<${cur?'button':'div'} class="row ${cur?'ed':''}" ${cur?`onclick="openEdit(${x.id})"`:''}>
        <div class="row-ic">${emo(x.store)}${av(x.partner)}</div>
        <div class="row-main"><div class="row-name">${nm}</div><div class="row-who">${P[x.partner]}</div></div>
        <div class="row-amt num">${fs(x.amount)}</div></${cur?'button':'div'}>`;}).join('')).join('');
    h+=`<div class="month ${openM.has(i)?'open':''}" id="m-${i}">
      <div class="m-head" role="button" tabindex="0" onclick="tglM(${i})">
        <div class="m-row"><span class="m-name">${MONTHS[i]}<span class="chev">›</span></span><span class="m-total num">${fs(e.tot)}</span></div>
        <div class="m-meta"><span class="m-who">${o?`${av(o.from==='Audrey'?0:1)}→${av(o.to==='Audrey'?0:1)}<span class="num">${fs(o.amt)}</span>`:(e.tot?'Équilibré 👌':'Aucune dépense')}</span>${pill}</div>
      </div>
      <div class="m-body">${body||''}<div class="m-foot num"><span><span class="dot a"></span>Audrey ${fs(e.a)}</span><span><span class="dot t"></span>Tom ${fs(e.t)}</span>${cur&&ex.length?'<span class="m-hint">Touchez une dépense pour la modifier</span>':''}</div></div>
    </div>`;
  }
  document.getElementById('months').innerHTML=h;
}
function tglM(i){openM.has(i)?openM.delete(i):openM.add(i);document.getElementById('m-'+i).classList.toggle('open');}
function tglV(i){st.vir[i]=!st.vir[i];save();rJournal();}
function jump(i){openM.add(i);rJournal();const el=document.getElementById('m-'+i);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});}

// ── Liste (groupée par magasin) ──
let liStore='';
function rList(){
  const opts=['',...KNOWN.filter(s=>s!=='Autres')];
  document.getElementById('li-stores').innerHTML=opts.map(s=>`<button class="chip ${liStore===s?'on':''}" onclick="liStore='${s}';rList()">${s?`<span class="e">${emo(s)}</span>${s}`:'<span class="e">📝</span>Sans magasin'}</button>`).join('');
  const active=st.list.filter(i=>!i.done),done=st.list.filter(i=>i.done);
  document.getElementById('li-sub').textContent=st.list.length?`${active.length} à prendre`:'';
  const g={};active.forEach(i=>{(g[i.store||'']=g[i.store||'']||[]).push(i);});
  const order=[...KNOWN.filter(s=>g[s]),...Object.keys(g).filter(s=>s&&!KNOWN.includes(s)).sort(),...(g['']?['']:[])];
  const row=i=>`<div class="it ${i.done?'done':''}">
    <button class="it-check" onclick="tglItem(${i.id})" aria-label="Cocher">${i.done?'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>':''}</button>
    <button class="it-text" onclick="tglItem(${i.id})">${esc(i.text)}</button>
    ${i.done?'':`<button class="it-star ${i.important?'on':''}" onclick="tglImp(${i.id})" aria-label="Important">★</button>`}
    <button class="it-del" onclick="delItem(${i.id})" aria-label="Supprimer">✕</button></div>`;
  let h=order.map(s=>{const its=g[s].sort((a,b)=>(b.important?1:0)-(a.important?1:0));
    return `<div class="group"><div class="g-head"><span class="g-name"><span class="e">${s?emo(s):'📝'}</span>${esc(s||'Sans magasin')}</span><span class="g-count">${its.length}</span></div><div class="g-body">${its.map(row).join('')}</div></div>`;}).join('');
  if(done.length)h+=`<div class="group basket"><div class="basket-head"><span class="g-name"><span class="e">🧺</span>Dans le panier · ${done.length}</span><button onclick="clearDone()">Tout retirer</button></div><div class="g-body">${done.map(row).join('')}</div></div>`;
  if(!st.list.length)h='<div class="empty"><span class="big">🐼</span>La liste est vide.<br>Ajoutez ce qui manque à la maison,<br>et rangez-le par magasin.</div>';
  else if(!active.length)h='<div class="empty"><span class="big">🎉</span>Tout est pris !</div>'+h;
  document.getElementById('li-groups').innerHTML=h;
  rBadge();
}
function rBadge(){const n=st.list.filter(i=>!i.done).length,b=document.getElementById('badge');b.hidden=!n;b.textContent=n;}
function addItem(){
  const inp=document.getElementById('li-input'),t=inp.value.trim();if(!t)return;
  st.list.push({id:st.listId++,text:t,done:false,store:liStore});
  inp.value='';save();rList();inp.focus();
}
function tglItem(id){const i=st.list.find(x=>x.id===id);if(i){i.done=!i.done;save();rList();}}
function tglImp(id){const i=st.list.find(x=>x.id===id);if(i){i.important=!i.important;save();rList();}}
function delItem(id){st.list=st.list.filter(x=>x.id!==id);save();rList();}
function clearDone(){const kept=st.list.filter(i=>i.done);st.list=st.list.filter(i=>!i.done);save();rList();toast(`${kept.length} article${kept.length>1?'s':''} retiré${kept.length>1?'s':''}`,()=>{st.list.push(...kept);save();rList();});}

// ── Toast avec « Annuler » ──
let toastT=null;
function toast(msg,undo){
  const el=document.getElementById('toast'),u=document.getElementById('toast-undo');
  document.getElementById('toast-msg').textContent=msg;
  u.hidden=!undo;u.onclick=()=>{el.classList.remove('on');undo&&undo();};
  el.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('on'),4000);
}

// ── Clavier physique (ordinateur, tablette avec clavier) ──
document.addEventListener('keydown',ev=>{
  if(view!=='saisir'||ev.metaKey||ev.ctrlKey||ev.altKey)return;
  const t=ev.target;if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.tagName==='SELECT'))return;
  if(/^[0-9]$/.test(ev.key))press(ev.key);
  else if(ev.key===','||ev.key==='.')press(',');
  else if(ev.key==='Backspace')press('⌫');
  else if(ev.key==='Enter'){if(!document.getElementById('save').disabled)submitExp();}
  else if(ev.key==='Escape'&&editId!==null)cancelEdit();
  else return;
  ev.preventDefault();
});

// ── Démarrage ──
load();
document.getElementById('logo').innerHTML=PANDA;
c.payer=me??0;rKeypad();rSaisir();rBadge();
if(me===null)openWho();
</script>
