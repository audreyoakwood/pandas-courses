<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3E93B0">
<meta name="description" content="Budget courses partagé et liste de courses pour Audrey & Tom">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PandaCourses">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>PandaCourses — Audrey & Tom</title>
<style>
  :root {
    --audrey: #3E93B8;
    --audrey-deep: #2F7A9B;
    --audrey-faint: #E4F1F6;
    --tom: #46A886;
    --tom-deep: #368A6D;
    --tom-faint: #E1F2EC;
    --ink: #26363A;
    --ink-2: #7C9195;
    --card: #FFFFFF;
    --line: #EDF1F0;
    --field: #F4F7F6;
    --positive: #368A6D;
    --negative: #D07A63;
    --sh-sm: 0 2px 8px rgba(40,70,75,0.06);
    --sh-md: 0 8px 24px rgba(40,70,75,0.10);
    --sh-lg: 0 14px 36px rgba(40,70,75,0.14);
    --r-xl: 26px; --r: 20px; --r-sm: 15px; --r-xs: 11px;
    --grad: linear-gradient(135deg, var(--audrey) 0%, var(--tom) 100%);
    --page: linear-gradient(165deg, #3E93B0 0%, #46A79E 42%, #52B896 100%);
  }
  * , *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: #56B4A8; }
  body {
    font-family: 'Avenir Next', 'Nunito Sans', 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif;
    color: var(--ink);
    max-width: 430px; margin: 0 auto; min-height: 100vh;
    background: var(--page); background-attachment: fixed;
    display: flex; flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Hero (sur le dégradé) ── */
  .hero { padding: 1.5rem 1.4rem 1.4rem; color: #fff; background: linear-gradient(180deg, rgba(20,50,55,0.28) 0%, rgba(20,50,55,0.08) 55%, transparent 100%); }
  .hero-top { display: flex; align-items: center; gap: 0.65rem; margin-bottom: 1.2rem; }
  .hero-logo { width: 44px; height: 44px; flex-shrink: 0; filter: drop-shadow(0 2px 6px rgba(0,0,0,0.25)); }
  .hero-app { font-size: 1.1rem; font-weight: 800; letter-spacing: -0.01em; text-shadow: 0 1px 5px rgba(0,0,0,0.3); }
  .hero-month { font-size: 1.25rem; font-weight: 800; letter-spacing: -0.01em; opacity: 1; margin-bottom: 0.55rem; text-shadow: 0 2px 6px rgba(0,0,0,0.3); }
  .hero-label { font-size: 0.84rem; font-weight: 600; opacity: 1; text-shadow: 0 1px 4px rgba(0,0,0,0.28); }
  .hero-total { font-size: 2.8rem; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -0.03em; line-height: 1.05; margin: 0.1rem 0 0.25rem; text-shadow: 0 2px 10px rgba(0,0,0,0.3); }
  .hero-sub { font-size: 0.8rem; font-weight: 600; opacity: 1; font-variant-numeric: tabular-nums; text-shadow: 0 1px 4px rgba(0,0,0,0.28); }

  /* ── Cards ── */
  .card { background: var(--card); border-radius: var(--r); box-shadow: var(--sh-md); }
  .stack { display: flex; flex-direction: column; gap: 0.85rem; padding: 0.3rem 1.1rem 1rem; }

  /* Équilibre */
  .equilibre { padding: 1rem 1.15rem; display: flex; align-items: center; justify-content: space-between; }
  .eq-label { font-size: 0.64rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink-2); }
  .eq-action { font-size: 0.9rem; font-weight: 700; margin-top: 0.15rem; }
  .eq-amount { font-size: 1.4rem; font-weight: 800; font-variant-numeric: tabular-nums; }
  .eq-amount.pos { color: var(--positive); }
  .eq-amount.neg { color: var(--negative); }
  .eq-ok { color: var(--positive); font-weight: 700; font-size: 0.9rem; }

  /* Bloc courses importantes */
  .imp-card { padding: 0.95rem 1.1rem; cursor: pointer; }
  .imp-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.7rem; }
  .imp-title { font-size: 0.82rem; font-weight: 800; display: flex; align-items: center; gap: 0.4rem; }
  .imp-title .st { color: #E8B44A; }
  .imp-see { font-size: 0.7rem; color: var(--ink-2); font-weight: 600; }
  .imp-items { display: flex; flex-direction: column; gap: 0.5rem; }
  .imp-it { display: flex; align-items: center; gap: 0.55rem; font-size: 0.84rem; }
  .imp-it .st { color: #E8B44A; font-size: 0.8rem; flex-shrink: 0; }
  .imp-name { flex: 1; font-weight: 500; word-break: break-word; }

  /* Ring */
  .ring-card { padding: 1.2rem 1.25rem; display: flex; align-items: center; gap: 1.3rem; }
  .ring-wrap { position: relative; width: 120px; height: 120px; flex-shrink: 0; }
  .ring-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .rc-amount { font-size: 1.2rem; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  .rc-label { font-size: 0.56rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink-2); }
  .legend { flex: 1; display: flex; flex-direction: column; gap: 0.85rem; }
  .lg-row { display: flex; align-items: center; gap: 0.6rem; }
  .lg-dot { width: 13px; height: 13px; border-radius: 5px; flex-shrink: 0; }
  .lg-dot.a { background: var(--audrey); } .lg-dot.t { background: var(--tom); }
  .lg-info { flex: 1; min-width: 0; }
  .lg-name { font-size: 0.82rem; font-weight: 700; }
  .lg-sub { font-size: 0.64rem; color: var(--ink-2); }
  .lg-amount { font-size: 0.95rem; font-weight: 700; font-variant-numeric: tabular-nums; }

  /* Trend */
  .trend-card { padding: 1.2rem 0 0.5rem; overflow: hidden; }
  .trend-head { padding: 0 1.25rem 0.8rem; display: flex; justify-content: space-between; align-items: flex-start; }
  .th-cap { font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-2); margin-bottom: 0.15rem; }
  .th-val { font-size: 1.1rem; font-weight: 800; font-variant-numeric: tabular-nums; }
  .trend-chart { width: 100%; display: block; }
  .trend-labels { display: flex; justify-content: space-between; padding: 0.35rem 1.25rem 0; font-size: 0.58rem; color: var(--ink-2); }

  /* Section titre */
  .sec-head { display: flex; justify-content: space-between; align-items: center; padding: 0.3rem 0.25rem 0.1rem; }
  .sec-title { font-size: 0.9rem; font-weight: 700; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.12); }
  .sec-action { font-size: 0.74rem; color: #fff; opacity: 0.9; background: none; border: none; cursor: pointer; font-family: inherit; font-weight: 600; }

  /* Expense */
  .exp-list { display: flex; flex-direction: column; gap: 0.6rem; }
  .exp { display: flex; align-items: center; gap: 0.75rem; background: var(--card); border-radius: var(--r-sm); padding: 0.7rem 0.85rem; box-shadow: var(--sh-sm); transition: transform 0.1s, box-shadow 0.15s; }
  .exp.editable { cursor: pointer; }
  .exp.editable:hover { box-shadow: var(--sh-md); transform: translateY(-1px); }
  .exp-ic { width: 40px; height: 40px; border-radius: 13px; display: flex; align-items: center; justify-content: center; font-size: 0.62rem; font-weight: 800; flex-shrink: 0; letter-spacing: -0.02em; }
  .exp-ic.a { background: var(--audrey-faint); color: var(--audrey-deep); }
  .exp-ic.t { background: var(--tom-faint); color: var(--tom-deep); }
  .exp-body { flex: 1; min-width: 0; }
  .exp-name { font-size: 0.85rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .exp-meta { font-size: 0.68rem; color: var(--ink-2); margin-top: 0.05rem; }
  .exp-right { text-align: right; flex-shrink: 0; }
  .exp-amt { font-size: 0.92rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .exp-who { font-size: 0.62rem; font-weight: 700; }
  .exp-who.a { color: var(--audrey-deep); } .exp-who.t { color: var(--tom-deep); }
  .empty { text-align: center; padding: 1.6rem 1rem; color: rgba(255,255,255,0.9); font-size: 0.82rem; }
  .empty.dark { color: var(--ink-2); }

  /* Month selector */
  .msel { display: flex; align-items: center; gap: 0.5rem; padding: 1.1rem 1.1rem 0.6rem; }
  .msel button { background: rgba(255,255,255,0.25); border: none; border-radius: 50%; width: 36px; height: 36px; cursor: pointer; color: #fff; font-size: 1.1rem; display: flex; align-items: center; justify-content: center; }
  .msel span { font-size: 0.95rem; font-weight: 700; flex: 1; text-align: center; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.12); }

  /* Year */
  .year-wrap { margin: 0.3rem 1.1rem 1rem; padding: 0.4rem 0.6rem; }
  .year-table { width: 100%; border-collapse: collapse; font-size: 0.75rem; }
  .year-table th { text-align: left; font-weight: 600; font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.03em; color: var(--ink-2); padding: 0.5rem 0.4rem; border-bottom: 1px solid var(--line); }
  .year-table td { padding: 0.6rem 0.4rem; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  .ya { text-align: right; color: var(--audrey-deep); }
  .yt { text-align: right; color: var(--tom-deep); }
  .ytot { text-align: right; font-weight: 700; }
  .yeq { text-align: right; font-weight: 700; }
  .yeq.pos { color: var(--positive); } .yeq.neg { color: var(--negative); }
  .yact { text-align: center; font-size: 0.64rem; }
  .yrow { cursor: pointer; transition: background 0.12s; }
  .yrow:hover { background: var(--field); }
  .yrow.cur { background: var(--audrey-faint); }
  .yrow .ym { position: relative; padding-left: 1.15rem; font-weight: 700; }
  .yrow .ym::before { content: '›'; position: absolute; left: 0.15rem; top: 50%; transform: translateY(-50%); color: var(--ink-2); transition: transform 0.2s; }
  .yrow.open .ym::before { transform: translateY(-50%) rotate(90deg); }
  .ydetail { display: none; } .ydetail.open { display: table-row; }
  .ydetail td { padding: 0; }
  .ydetail-in { padding: 0.6rem 0.4rem 0.7rem; background: var(--field); }
  .ydetail-in .exp-list { gap: 0.35rem; }
  .ydetail-in .exp { box-shadow: none; border: 1px solid var(--line); }
  .vbar { display: flex; align-items: center; justify-content: space-between; padding: 0.6rem 0.75rem; margin-bottom: 0.5rem; background: var(--card); border-radius: var(--r-xs); box-shadow: var(--sh-sm); }
  .vinfo { font-size: 0.78rem; font-weight: 600; } .vamt { font-size: 0.82rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .vbtn { font-size: 0.7rem; padding: 0.35rem 0.8rem; border-radius: 20px; border: none; cursor: pointer; font-family: inherit; font-weight: 700; background: var(--grad); color: #fff; }
  .vbtn.done { background: var(--tom-faint); color: var(--tom-deep); cursor: default; }
  .table-wrap { overflow-x: auto; }

  /* FAB */
  .fab { position: fixed; bottom: calc(64px + 1rem); right: calc(50% - 215px + 1rem); width: 56px; height: 56px; border-radius: 50%; background: #fff; color: var(--tom-deep); border: none; font-size: 1.7rem; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: var(--sh-lg); transition: transform 0.15s; z-index: 10; }
  @media (max-width: 470px) { .fab { right: 1.3rem; } }
  .quick-add { display: flex; align-items: center; justify-content: center; gap: 0.55rem; width: 100%; padding: 0.95rem; border: none; border-radius: var(--r); background: #fff; color: var(--tom-deep); font-family: inherit; font-size: 1rem; font-weight: 800; cursor: pointer; box-shadow: var(--sh-md); transition: transform 0.15s; }
  .quick-add span { display: flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 50%; background: var(--grad); color: #fff; font-size: 1.25rem; line-height: 1; }
  .quick-add:active { transform: scale(0.97); }
  .fab:hover { transform: scale(1.08); } .fab:active { transform: scale(0.94); }

  /* Bottom nav */
  .nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 430px; background: #fff; box-shadow: 0 -4px 20px rgba(40,70,75,0.10); display: flex; z-index: 10; }
  .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 0.15rem; padding: 0.6rem 0 0.55rem; background: none; border: none; cursor: pointer; color: var(--ink-2); font-family: inherit; font-size: 0.6rem; letter-spacing: 0.02em; transition: color 0.15s; }
  .nav-item.active { color: var(--tom-deep); }
  .nav-item svg { width: 21px; height: 21px; }

  /* Modal */
  .overlay { position: fixed; inset: 0; background: rgba(40,60,60,0.4); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); display: none; align-items: flex-end; justify-content: center; z-index: 100; }
  .overlay.open { display: flex; }
  .modal { background: #fff; width: 100%; max-width: 430px; border-radius: var(--r-xl) var(--r-xl) 0 0; padding: 1.3rem 1.3rem 1.9rem; box-shadow: var(--sh-lg); animation: up 0.3s cubic-bezier(0.16,1,0.3,1); }
  @keyframes up { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .handle { width: 40px; height: 4px; background: var(--line); border-radius: 2px; margin: 0 auto 1.1rem; }
  .m-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.1rem; }
  .m-head h2 { font-size: 1.1rem; font-weight: 800; }
  .m-del { font-size: 0.72rem; padding: 0.35rem 0.8rem; border-radius: 10px; border: 1px solid var(--negative); background: none; color: var(--negative); cursor: pointer; font-family: inherit; font-weight: 600; display: none; }
  .m-del.on { display: block; }
  .fld { margin-bottom: 0.9rem; }
  .fld label { display: block; font-size: 0.64rem; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-2); margin-bottom: 0.3rem; }
  .fld input, .fld select { width: 100%; padding: 0.68rem 0.85rem; border: 1.5px solid var(--line); border-radius: var(--r-xs); background: var(--field); color: var(--ink); font-family: inherit; font-size: 0.88rem; outline: none; transition: border-color 0.15s; }
  .fld input:focus, .fld select:focus { border-color: var(--audrey); }
  .fld-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.7rem; }
  .fld-comment { display: none; } .fld-comment.on { display: block; }
  .ptoggle { display: flex; gap: 0.55rem; }
  .pbtn { flex: 1; padding: 0.6rem; border: 2px solid var(--line); border-radius: var(--r-xs); background: #fff; color: var(--ink-2); font-family: inherit; font-size: 0.84rem; font-weight: 700; cursor: pointer; text-align: center; transition: all 0.15s; }
  .pbtn.a.sel { border-color: var(--audrey); background: var(--audrey-faint); color: var(--audrey-deep); }
  .pbtn.t.sel { border-color: var(--tom); background: var(--tom-faint); color: var(--tom-deep); }
  .btn-go { width: 100%; padding: 0.82rem; border: none; border-radius: var(--r-sm); background: var(--grad); color: #fff; font-family: inherit; font-size: 0.9rem; font-weight: 800; cursor: pointer; margin-top: 0.5rem; box-shadow: var(--sh-md); }
  .btn-go:hover { opacity: 0.94; }

  .view { display: none; flex: 1; } .view.active { display: flex; flex-direction: column; }
  .content { flex: 1; padding-bottom: 84px; overflow-y: auto; }

  /* Liste de courses */
  .list-add { display: flex; gap: 0.5rem; padding: 1rem 1.1rem 0.6rem; flex-wrap: wrap; }
  .list-add input { flex: 1; min-width: 55%; padding: 0.72rem 0.9rem; border: none; border-radius: var(--r-sm); background: #fff; color: var(--ink); font-family: inherit; font-size: 0.9rem; outline: none; box-shadow: var(--sh-sm); }
  .li-store-sel { flex: 1; padding: 0.72rem 0.6rem; border: none; border-radius: var(--r-sm); background: #fff; color: var(--ink); font-family: inherit; font-size: 0.84rem; outline: none; box-shadow: var(--sh-sm); }
  .list-add button { width: 46px; flex-shrink: 0; border: none; border-radius: var(--r-sm); background: #fff; color: var(--tom-deep); font-size: 1.5rem; cursor: pointer; box-shadow: var(--sh-sm); }
  .list-add button:active { transform: scale(0.94); }
  .li-filters { display: flex; gap: 0.4rem; padding: 0.2rem 1.1rem 0.5rem; flex-wrap: wrap; }
  .fchip { font-size: 0.68rem; font-weight: 700; padding: 0.34rem 0.75rem; border-radius: 20px; background: rgba(255,255,255,0.28); color: #fff; border: none; cursor: pointer; font-family: inherit; transition: background 0.15s, color 0.15s; }
  .fchip.on { background: #fff; color: var(--tom-deep); }
  .list-count { padding: 0 1.35rem 0.4rem; font-size: 0.7rem; color: rgba(255,255,255,0.9); font-weight: 600; }
  #li-list.stack { gap: 0.4rem; }
  .li { display: flex; align-items: center; gap: 0.65rem; background: #fff; border-radius: var(--r-xs); padding: 0.48rem 0.75rem; box-shadow: var(--sh-sm); transition: opacity 0.15s; }
  .li-check { width: 19px; height: 19px; border-radius: 50%; border: 2px solid #A9D6C6; flex-shrink: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #fff; transition: background 0.15s, border-color 0.15s; }
  .li.done .li-check { background: var(--tom); border-color: var(--tom); }
  .li-main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; cursor: pointer; }
  .li-text { font-size: 0.82rem; font-weight: 500; word-break: break-word; }
  .li.done .li-text { text-decoration: line-through; color: var(--ink-2); }
  .li-tag { font-size: 0.58rem; font-weight: 800; padding: 0.18rem 0.55rem; border-radius: 20px; background: var(--tom-faint); color: var(--tom-deep); white-space: nowrap; text-transform: uppercase; letter-spacing: 0.04em; }
  .li.done .li-tag { opacity: 0.55; }
  .li-star { background: none; border: none; cursor: pointer; font-size: 1rem; line-height: 1; color: #D5DBD9; padding: 0.15rem 0.25rem; flex-shrink: 0; transition: color 0.15s, transform 0.1s; }
  .li-star.on { color: #E8B44A; }
  .li-star:active { transform: scale(1.25); }
  .li.imp { background: #FFFBF0; box-shadow: inset 3px 0 0 #E8B44A, var(--sh-sm); }
  .li-del { background: none; border: none; color: var(--ink-2); font-size: 1rem; cursor: pointer; padding: 0.2rem 0.35rem; border-radius: 6px; opacity: 0.6; }
  .li-del:hover { opacity: 1; color: var(--negative); }
</style>

<div id="v-home" class="view active">
  <div class="hero" id="hero"></div>
  <div class="content">
    <div class="stack">
      <button class="quick-add" onclick="openAdd()"><span>+</span>Ajouter une dépense</button>
      <div class="card equilibre" id="equilibre"></div>
      <div class="card imp-card" id="imp-card" onclick="go('list')"></div>
      <div class="card ring-card" id="ring"></div>
      <div class="card trend-card" id="trend"></div>
      <div class="sec-head"><span class="sec-title">Dépenses récentes</span><button class="sec-action" onclick="go('history')">Tout voir</button></div>
      <div class="exp-list" id="recent"></div>
    </div>
  </div>
</div>

<div id="v-history" class="view">
  <div class="msel" id="msel"></div>
  <div class="content"><div class="stack" id="hist"></div></div>
</div>

<div id="v-list" class="view">
  <div class="list-add">
    <input id="li-input" type="text" placeholder="Ajouter un article…" onkeydown="if(event.key==='Enter')addItem()">
    <select id="li-store" class="li-store-sel" title="Magasin">
      <option value="">--</option>
      <option>Bioveyre</option><option>Carrefour</option><option>Picard</option>
      <option>Malongo</option><option>Leclerc</option><option>Biocoop</option><option>Autres</option>
    </select>
    <button onclick="addItem()">+</button>
  </div>
  <div class="li-filters" id="li-filters"></div>
  <div class="list-count" id="li-count"></div>
  <div class="content"><div class="stack" id="li-list"></div></div>
</div>

<div id="v-year" class="view">
  <div style="padding:1.4rem 1.25rem 0.3rem"><h2 style="font-size:1.2rem;font-weight:800;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,0.12)">Récap 2026</h2></div>
  <div class="content"><div class="card year-wrap"><div class="table-wrap" id="year"></div></div></div>
</div>

<button class="fab" onclick="openAdd()" id="fab" style="display:none">+</button>

<nav class="nav">
  <button class="nav-item active" data-v="home" onclick="go('home')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0a1 1 0 01-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 01-1 1h-2z"/></svg>Accueil</button>

function cm(){return new Date().getMonth();}
function monExp(m){const k=String(m+1).padStart(2,'0');return st.exp.filter(e=>e.date.slice(5,7)===k);}

function rRing(){

  const fa=e.a/tot,ft=e.t/tot,gap=(e.tot>0&&fa>0&&ft>0)?3:0;
  const aD=`${Math.max(fa*C-gap,0)} ${C}`,tD=`${Math.max(ft*C-gap,0)} ${C}`,tOff=-(fa*C);
  const svg=`<svg viewBox="0 0 120 120" width="120" height="120">
    <circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--line)" stroke-width="15"/>
    ${e.tot>0?`<circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--audrey)" stroke-width="15" stroke-linecap="round" stroke-dasharray="${aD}" transform="rotate(-90 60 60)"/>

  </svg>`;
  const pct=e.tot>0?Math.round(fa*100):0;
  document.getElementById('ring').innerHTML=`
    <div class="ring-wrap">${svg}<div class="ring-center"><div class="rc-amount">${fs(e.tot)}</div><div class="rc-label">ce mois</div></div></div>

    </div>`;
}
function smooth(pts){let d=`M ${pts[0].x} ${pts[0].y}`;for(let i=0;i<pts.length-1;i++){const a=pts[i],b=pts[i+1],mx=(a.x+b.x)/2;d+=` C ${mx} ${a.y}, ${mx} ${b.y}, ${b.x} ${b.y}`;}return d;}
function rTrend(){
  const m=cm(),W=386,H=100,pad=8;
  const vals=[];for(let i=0;i<=m;i++)vals.push(eq(i).tot);
  const mx=Math.max(...vals,1),n=vals.length,step=n>1?(W-pad*2)/(n-1):0,top=14,bot=8;
  let pts=vals.map((v,i)=>({x:pad+i*step,y:top+(1-v/mx)*(H-top-bot)}));
  if(pts.length===1)pts.push({x:W-pad,y:pts[0].y});
  const line=smooth(pts),area=`${line} L ${pts[pts.length-1].x} ${H} L ${pts[0].x} ${H} Z`;
  const yr=vals.reduce((s,v)=>s+v,0),li=[0,Math.floor(m/2),m];

      <div style="text-align:right"><div class="th-cap">Ce mois</div><div class="th-val">${fs(vals[m])}</div></div></div>
    <svg class="trend-chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" height="${H}">
      <defs><linearGradient id="wf" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#3E93B8" stop-opacity="0.4"/><stop offset="100%" stop-color="#46A886" stop-opacity="0.03"/></linearGradient>

      <path d="${area}" fill="url(#wf)"/>
      <path d="${line}" fill="none" stroke="url(#wl)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="${pts[pts.length-1].x}" cy="${pts[pts.length-1].y}" r="4.5" fill="#fff" stroke="#46A886" stroke-width="2.5"/>

}

    rows+=`<tr class="yrow ${i===c?'cur':''}" onclick="tglY(${i})">

      <td class="ya">${e.a?fs(e.a):'–'}</td><td class="yt">${e.t?fs(e.t):'–'}</td>
      <td class="ytot">${e.tot?fs(e.tot):'–'}</td>
      <td class="yeq ${dv>0.01?'neg':dv<-0.01?'pos':''}">${Math.abs(dv)>0.01?fs(Math.abs(dv)):'–'}</td>
      <td class="yact">${al}</td></tr>`;
    const me=monExp(i).sort((a,b)=>b.date.localeCompare(a.date));
    const owe=dv>0?'Tom':'Audrey',get=dv>0?'Audrey':'Tom';
    const vh=Math.abs(dv)>0.01?`<div class="vbar"><div><div class="vinfo">${owe} › ${get}</div><div class="vamt">${fs(Math.abs(dv))}</div></div>
      <button class="vbtn ${done?'done':''}" onclick="event.stopPropagation();tglV(${i})">${done?'✓ Fait':'Marquer fait'}</button></div>`:'';
    rows+=`<tr class="ydetail" id="yd-${i}"><td colspan="6"><div class="ydetail-in">${vh}<div class="exp-list">${me.length?me.map(e=>expRow(e,false)).join(''):'<div class="empty dark">Aucune dépense.</div>'}</div></div></td></tr>`;
  }
  document.getElementById('year').innerHTML=`<table class="year-table"><thead><tr><th>Mois</th><th class="ya">Aud.</th><th class="yt">Tom</th><th class="ytot">Total</th><th class="yeq">Écart</th><th style="text-align:center">Vir.</th></tr></thead><tbody>${rows}</tbody></table>`;
}
function tglY(i){const r=document.getElementById(`yd-${i}`);r.classList.toggle('open');r.previousElementSibling.classList.toggle('open');}
function tglV(i){st.vir[i]=!st.vir[i];save();rYear();}
function pm(){st.vm=Math.max(0,st.vm-1);rHist();}
function nm(){st.vm=Math.min(11,st.vm+1);rHist();}
function go(v){
  document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));
  document.getElementById('v-'+v).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active',b.dataset.v===v));
  document.getElementById('fab').style.display=v==='history'?'flex':'none';
  if(v==='home')rImportant();if(v==='history')rHist();if(v==='year')rYear();if(v==='list')rList();
}

let listFilter='all';
function setFilter(f){listFilter=f;rList();}
function rFilters(stores,hasNone){
  const el=document.getElementById('li-filters');
  if(!stores.length&&!hasNone){el.innerHTML='';return;}
  let chips=`<button class="fchip ${listFilter==='all'?'on':''}" onclick="setFilter('all')">Tous</button>`;
  chips+=stores.map(s=>{
    const [bg,fg]=tagStyle(s);
    const style=listFilter===s?`background:${fg};color:#fff`:`background:${bg};color:${fg}`;
    return `<button class="fchip" style="${style}" onclick="setFilter('${s.replace(/'/g,"\\'")}')">${s}</button>`;
  }).join('');
  if(hasNone){
    const on=listFilter==='__none__';
    const style=on?`background:#6B7A78;color:#fff`:`background:#ECEFEE;color:#6B7A78`;
    chips+=`<button class="fchip" style="${style}" onclick="setFilter('__none__')">--</button>`;
  }
  el.innerHTML=chips;
}
function rList(){
  const el=document.getElementById('li-list');
  if(!st.list.length){
    document.getElementById('li-filters').innerHTML='';
    document.getElementById('li-count').textContent='';
    el.innerHTML='<div class="empty">La liste est vide.<br>Ajoutez ce qui manque à la maison.</div>';return;
  }
  // magasins distincts présents
  const stores=[...new Set(st.list.map(i=>i.store).filter(Boolean))].sort();
  const hasNone=st.list.some(i=>!i.store);
  if(listFilter!=='all'&&listFilter!=='__none__'&&!stores.includes(listFilter))listFilter='all';
  if(listFilter==='__none__'&&!hasNone)listFilter='all';
  rFilters(stores,hasNone);
  const shown=listFilter==='all'?st.list:(listFilter==='__none__'?st.list.filter(i=>!i.store):st.list.filter(i=>i.store===listFilter));
  const active=shown.filter(i=>!i.done).sort((a,b)=>(b.important?1:0)-(a.important?1:0)),done=shown.filter(i=>i.done);
  document.getElementById('li-count').textContent=`${active.length} à prendre${done.length?` · ${done.length} pris`:''}`;
  if(!shown.length){el.innerHTML='<div class="empty">Aucun article pour ce magasin.</div>';return;}
  const row=i=>`<div class="li ${i.done?'done':''} ${i.important&&!i.done?'imp':''}">
    <div class="li-check" onclick="tglItem(${i.id})">${i.done?'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>':''}</div>
    <div class="li-main" onclick="tglItem(${i.id})"><span class="li-text">${i.text}</span>${i.store?`<span class="li-tag" style="background:${tagStyle(i.store)[0]};color:${tagStyle(i.store)[1]}">${i.store}</span>`:''}</div>
    <button class="li-star ${i.important?'on':''}" onclick="tglImp(${i.id})" title="Important">${i.important?'★':'☆'}</button>
    <button class="li-del" onclick="delItem(${i.id})">✕</button></div>`;
  el.innerHTML=[...active,...done].map(row).join('');
}
function addItem(){
  const inp=document.getElementById('li-input'),t=inp.value.trim();
  if(!t)return;
  const store=document.getElementById('li-store').value;
  st.list.push({id:st.listId++,text:t,done:false,store:store||''});
  inp.value='';save();rList();inp.focus();
}
function tglItem(id){const i=st.list.find(x=>x.id===id);if(i){i.done=!i.done;save();rList();}}
function tglImp(id){const i=st.list.find(x=>x.id===id);if(i){i.important=!i.important;save();rList();}}
function delItem(id){st.list=st.list.filter(x=>x.id!==id);save();rList();}
function reset(){
  document.getElementById('f-amount').value='';
  document.getElementById('f-date').value=new Date().toISOString().slice(0,10);
  document.getElementById('f-store').value='Bioveyre';
  document.getElementById('f-comment').value='';
  document.getElementById('f-comment-wrap').classList.remove('on');
  st.sel=0;editId=null;
  document.getElementById('m-title').textContent='Nouvelle dépense';
  document.getElementById('m-go').textContent='Ajouter';
  document.getElementById('m-del').classList.remove('on');
  rPT();
}
function openAdd(){reset();document.getElementById('overlay').classList.add('open');}
function openEdit(id){
  const e=st.exp.find(x=>x.id===id);if(!e)return;editId=id;
  document.getElementById('overlay').classList.add('open');
  document.getElementById('m-title').textContent='Modifier la dépense';
  document.getElementById('m-go').textContent='Enregistrer';
  document.getElementById('m-del').classList.add('on');
  const k=KNOWN.includes(e.store);
  document.getElementById('f-store').value=k?e.store:'Autres';
  if(!k){document.getElementById('f-comment-wrap').classList.add('on');document.getElementById('f-comment').value=e.comment||e.store;}
  else if(e.store==='Autres'){document.getElementById('f-comment-wrap').classList.add('on');document.getElementById('f-comment').value=e.comment||'';}
  else{document.getElementById('f-comment-wrap').classList.remove('on');document.getElementById('f-comment').value=e.comment||'';}
  document.getElementById('f-amount').value=e.amount;
  document.getElementById('f-date').value=e.date;
  st.sel=e.partner;rPT();
}
function closeM(){document.getElementById('overlay').classList.remove('open');}
function closeOutside(ev){if(ev.target===ev.currentTarget)closeM();}
function onStore(){const w=document.getElementById('f-comment-wrap');document.getElementById('f-store').value==='Autres'?w.classList.add('on'):w.classList.remove('on');}
function rPT(){document.getElementById('ptoggle').innerHTML=P.map((n,i)=>`<button class="pbtn ${pc(i)} ${st.sel===i?'sel':''}" onclick="selP(${i})">${n}</button>`).join('');}
function selP(i){st.sel=i;rPT();}
function submitExp(){
  const store=document.getElementById('f-store').value,amount=parseFloat(document.getElementById('f-amount').value),
    date=document.getElementById('f-date').value,comment=document.getElementById('f-comment').value.trim();
  if(!store||isNaN(amount)||amount<=0||!date)return;
  if(editId!==null){const e=st.exp.find(x=>x.id===editId);if(e){e.store=store;e.amount=amount;e.date=date;e.partner=st.sel;if(comment)e.comment=comment;else delete e.comment;}}
  else{const e={id:st.nextId++,store,amount,date,partner:st.sel};if(comment)e.comment=comment;st.exp.push(e);}
  save();closeM();rAll();if(document.getElementById('v-history').classList.contains('active'))rHist();
}
function delEditing(){if(editId===null)return;st.exp=st.exp.filter(e=>e.id!==editId);save();closeM();rAll();if(document.getElementById('v-history').classList.contains('active'))rHist();}
function rImportant(){
  const card=document.getElementById('imp-card');
  const items=(st.list||[]).filter(i=>i.important&&!i.done);
  if(!items.length){card.style.display='none';return;}
  card.style.display='block';
  card.innerHTML=`<div class="imp-head"><div class="imp-title"><span class="st">★</span> À ne pas oublier</div><span class="imp-see">Voir la liste ›</span></div>
    <div class="imp-items">${items.map(i=>`<div class="imp-it"><span class="st">★</span><span class="imp-name">${i.text}</span>${i.store?`<span class="li-tag" style="background:${tagStyle(i.store)[0]};color:${tagStyle(i.store)[1]}">${i.store}</span>`:''}</div>`).join('')}</div>`;
}
function rAll(){rHero();rEq();rImportant();rRing();rTrend();rRecent();}
load();rAll();
</script>

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
