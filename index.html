<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F6F3">
<meta name="description" content="Budget courses partagé et liste de courses pour Audrey & Tom">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PandaCourses">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>PandaCourses — Audrey & Tom</title>
<style>
  :root {
    --bg: #F6F6F3;
    --card: #FFFFFF;
    --ink: #1F2523;
    --ink-2: #6F7672;
    --ink-3: #A3A8A4;
    --line: #E7E7E2;
    --field: #EFEFEB;
    --audrey: #5E7FA0;
    --audrey-faint: #EDF1F5;
    --tom: #7D9C83;
    --tom-faint: #EEF3EF;
    --pos: #4E7A5A;
    --neg: #B0614C;
    --star: #C9A24A;
    --r: 16px; --r-sm: 12px;
    --tabbar: 62px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--bg); }
  body {
    font-family: -apple-system, 'SF Pro Text', 'Segoe UI', system-ui, 'Helvetica Neue', sans-serif;
    color: var(--ink); background: var(--bg);
    max-width: 430px; margin: 0 auto; min-height: 100vh; min-height: 100dvh;
    -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  }
  button { font-family: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  input, select { font-family: inherit; color: var(--ink); }
  .num { font-variant-numeric: tabular-nums; }

  .view { display: none; padding: 0 16px calc(var(--tabbar) + 24px + env(safe-area-inset-bottom)); }
  .view.active { display: block; }

  /* En-tête commun */
  .top { display: flex; align-items: center; justify-content: space-between; padding: 14px 2px 10px; padding-top: calc(14px + env(safe-area-inset-top)); }
  .top h1 { font-size: 1.35rem; font-weight: 700; letter-spacing: -0.02em; }
  .brand { display: flex; align-items: center; gap: 8px; }
  .brand-logo { width: 28px; height: 28px; }
  .me { font-size: 0.78rem; color: var(--ink-2); padding: 6px 10px; border-radius: 20px; border: 1px solid var(--line); background: var(--card); }
  .me b { color: var(--ink); font-weight: 600; }
  .sub { font-size: 0.8rem; color: var(--ink-2); }

  /* ── Saisir : balance ── */
  .bal { display: block; width: 100%; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; }
  .bal-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .bal-title { font-size: 0.95rem; font-weight: 600; }
  .bal-title .amt-neg { color: var(--neg); } .bal-title .amt-pos { color: var(--pos); }
  .bal-more { font-size: 0.72rem; color: var(--ink-3); white-space: nowrap; }
  .bal-bar { position: relative; display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--field); margin: 10px 0 7px; }
  .bal-bar .a { background: var(--audrey); } .bal-bar .t { background: var(--tom); }
  .bal-bar .mid { position: absolute; left: 50%; top: -3px; bottom: -3px; width: 2px; margin-left: -1px; background: var(--card); }
  .bal-legend { display: flex; justify-content: space-between; font-size: 0.74rem; color: var(--ink-2); }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; }
  .dot.a { background: var(--audrey); } .dot.t { background: var(--tom); }

  /* ── Saisir : composeur ── */
  .composer { margin-top: 14px; }
  .edit-banner { display: none; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 10px 8px 14px; margin-bottom: 8px; border-radius: var(--r-sm); background: var(--field); font-size: 0.8rem; }
  .edit-banner.on { display: flex; }
  .edit-banner .acts { display: flex; gap: 4px; }
  .edit-banner button { font-size: 0.78rem; font-weight: 600; padding: 6px 10px; border-radius: 8px; }
  .edit-banner .del { color: var(--neg); }
  .amount { text-align: center; padding: 6px 0 10px; }
  .amount-val { font-size: 3.1rem; font-weight: 700; letter-spacing: -0.03em; line-height: 1.1; }
  .amount-val.zero { color: var(--ink-3); }
  .amount-cap { font-size: 0.74rem; color: var(--ink-2); margin-top: 2px; min-height: 1em; }

  .chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 2px 0 4px; margin: 0 -16px; padding-left: 16px; padding-right: 16px; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex-shrink: 0; font-size: 0.84rem; font-weight: 500; padding: 8px 13px; border-radius: 20px; background: var(--card); border: 1px solid var(--line); white-space: nowrap; }
  .chip.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .other-in { display: none; width: 100%; margin-top: 6px; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--card); font-size: 0.9rem; outline: none; }
  .other-in.on { display: block; }
  .other-in:focus { border-color: var(--ink-2); }

  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .seg { display: flex; background: var(--field); border-radius: var(--r-sm); padding: 3px; }
  .seg button { flex: 1; font-size: 0.82rem; font-weight: 500; padding: 8px 4px; border-radius: 9px; color: var(--ink-2); white-space: nowrap; }
  .seg button.on { background: var(--card); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,0.08); }
  .seg.payer button.on.a { color: var(--audrey); } .seg.payer button.on.t { color: var(--tom); }
  .date-in { display: none; width: 100%; margin-top: 6px; padding: 9px 12px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--card); font-size: 0.88rem; }
  .date-in.on { display: block; }

  .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 12px; }
  .key { height: 50px; border-radius: var(--r-sm); background: var(--card); border: 1px solid var(--line); font-size: 1.3rem; font-weight: 500; display: flex; align-items: center; justify-content: center; user-select: none; }
  .key:active { background: var(--field); }
  .key.fn { background: transparent; border-color: transparent; color: var(--ink-2); }
  .save { width: 100%; margin-top: 10px; padding: 15px; border-radius: var(--r); background: var(--ink); color: #fff; font-size: 1rem; font-weight: 600; transition: opacity 0.15s; }
  .save:disabled { opacity: 0.28; cursor: default; }

  /* ── Journal ── */
  .ycard { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 14px 10px; }
  .ycard-head { display: flex; justify-content: space-between; align-items: baseline; }
  .ycard-total { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em; }
  .bars { display: flex; align-items: flex-end; gap: 4px; height: 64px; margin-top: 12px; }
  .bars button { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 4px; }
  .bars .b { width: 100%; border-radius: 3px; background: var(--line); min-height: 2px; }
  .bars .b.cur { background: var(--ink); }
  .bars .l { font-size: 0.56rem; color: var(--ink-3); }

  .month { margin-top: 12px; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
  .m-head { display: block; width: 100%; text-align: left; padding: 12px 14px; cursor: pointer; }
  .m-row { display: flex; justify-content: space-between; align-items: baseline; }
  .m-name { font-size: 1rem; font-weight: 600; }
  .m-name .chev { display: inline-block; color: var(--ink-3); margin-left: 4px; transition: transform 0.2s; }
  .month.open .m-name .chev { transform: rotate(90deg); }
  .m-total { font-size: 1rem; font-weight: 600; }
  .m-meta { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; font-size: 0.78rem; color: var(--ink-2); gap: 8px; }
  .vir { font-size: 0.72rem; font-weight: 600; padding: 4px 9px; border-radius: 20px; border: 1px solid var(--line); white-space: nowrap; }
  .vir.todo { color: var(--neg); border-color: #EBD3CC; background: #FBF4F2; }
  .vir.done { color: var(--pos); border-color: #D5E2D8; background: #F3F7F4; }
  .vir.cur { color: var(--ink-3); border-style: dashed; cursor: default; }
  .m-body { display: none; border-top: 1px solid var(--line); }
  .month.open .m-body { display: block; }
  .day { padding: 8px 14px 2px; font-size: 0.7rem; font-weight: 600; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.04em; }
  .row { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 8px 14px; }
  .row.ed:active { background: var(--field); }
  .row-ic { width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 0.6rem; font-weight: 700; flex-shrink: 0; }
  .row-ic.a { background: var(--audrey-faint); color: var(--audrey); } .row-ic.t { background: var(--tom-faint); color: var(--tom); }
  .row-main { flex: 1; min-width: 0; }
  .row-name { font-size: 0.88rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row-who { font-size: 0.72rem; color: var(--ink-2); }
  .row-amt { font-size: 0.92rem; font-weight: 600; }
  .m-foot { padding: 6px 14px 12px; font-size: 0.72rem; color: var(--ink-3); }

  /* ── Liste ── */
  .add { display: flex; gap: 6px; }
  .add input { flex: 1; min-width: 0; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--card); font-size: 0.95rem; outline: none; }
  .add input:focus { border-color: var(--ink-2); }
  .add button { width: 48px; border-radius: var(--r-sm); background: var(--ink); color: #fff; font-size: 1.4rem; }
  .add-stores { margin-top: 8px; }
  .add-stores .chip { font-size: 0.76rem; padding: 6px 11px; }
  .group { margin-top: 16px; }
  .g-head { display: flex; justify-content: space-between; align-items: baseline; padding: 0 2px 6px; }
  .g-name { font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-2); }
  .g-count { font-size: 0.74rem; color: var(--ink-3); }
  .g-body { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
  .it { display: flex; align-items: center; gap: 10px; padding: 0 6px 0 12px; min-height: 48px; border-top: 1px solid var(--line); }
  .it:first-child { border-top: none; }
  .it-check { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--ink-3); flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: #fff; }
  .it.done .it-check { background: var(--ink-2); border-color: var(--ink-2); }
  .it-text { flex: 1; min-width: 0; font-size: 0.92rem; padding: 12px 0; word-break: break-word; text-align: left; }
  .it.done .it-text { color: var(--ink-3); text-decoration: line-through; }
  .it-star { font-size: 1.05rem; color: var(--line); padding: 8px 6px; }
  .it-star.on { color: var(--star); }
  .it-del { font-size: 0.9rem; color: var(--ink-3); padding: 8px 8px; }
  .basket-head { display: flex; justify-content: space-between; align-items: center; margin-top: 22px; padding: 0 2px 6px; }
  .basket-head button { font-size: 0.76rem; color: var(--ink-2); text-decoration: underline; }
  .empty { text-align: center; color: var(--ink-2); font-size: 0.86rem; padding: 40px 20px; line-height: 1.5; }

  /* ── Barre d'onglets ── */
  .tabbar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 430px; display: flex; background: rgba(246,246,243,0.94); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); z-index: 10; }
  .tab { flex: 1; height: var(--tabbar); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 0.66rem; color: var(--ink-3); position: relative; }
  .tab svg { width: 22px; height: 22px; }
  .tab.on { color: var(--ink); font-weight: 600; }
  .badge[hidden] { display: none; }
  .badge { position: absolute; top: 8px; left: calc(50% + 6px); min-width: 17px; height: 17px; padding: 0 5px; border-radius: 9px; background: var(--ink); color: #fff; font-size: 0.62rem; font-weight: 700; display: flex; align-items: center; justify-content: center; }

  /* ── Toast & feuille « qui suis-je » ── */
  .toast { position: fixed; left: 50%; bottom: calc(var(--tabbar) + 14px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px); opacity: 0; pointer-events: none; width: calc(100% - 32px); max-width: 398px; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; border-radius: var(--r-sm); background: var(--ink); color: #fff; font-size: 0.86rem; transition: opacity 0.2s, transform 0.2s; z-index: 20; }
  .toast.on { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  .toast button { color: #fff; font-weight: 700; font-size: 0.82rem; text-decoration: underline; }
  .sheet-bg { position: fixed; inset: 0; background: rgba(20,25,23,0.35); display: none; align-items: flex-end; justify-content: center; z-index: 30; }
  .sheet-bg.on { display: flex; }
  .sheet { width: 100%; max-width: 430px; background: var(--card); border-radius: 22px 22px 0 0; padding: 22px 18px calc(22px + env(safe-area-inset-bottom)); }
  .sheet h2 { font-size: 1.1rem; font-weight: 700; }
  .sheet p { font-size: 0.86rem; color: var(--ink-2); margin: 6px 0 16px; line-height: 1.45; }
  .sheet .who { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .sheet .who button { padding: 16px; border-radius: var(--r); border: 1px solid var(--line); font-size: 1rem; font-weight: 600; }
  .sheet .who button.a { color: var(--audrey); } .sheet .who button.t { color: var(--tom); }
</style>
</head>
<body>

<!-- ── Saisir ── -->
<section id="v-saisir" class="view active">
  <header class="top">
    <div class="brand"><span class="brand-logo" id="logo"></span><h1>Courses</h1></div>
    <button class="me" onclick="openWho()" id="me-btn"></button>
  </header>
  <button class="bal" id="bal" onclick="go('journal')"></button>

  <div class="composer">
    <div class="edit-banner" id="edit-banner">
      <span id="edit-label">Modification</span>
      <div class="acts"><button class="del" onclick="delEditing()">Supprimer</button><button onclick="cancelEdit()">Annuler</button></div>
    </div>
    <div class="amount">
      <div class="amount-val num zero" id="amt-val">0 €</div>
      <div class="amount-cap" id="amt-cap"></div>
    </div>
    <div class="chips" id="store-chips"></div>
    <input class="other-in" id="other-in" type="text" placeholder="Préciser (ex. pharmacie, marché…)" oninput="rSave()">
    <div class="row2">
      <div class="seg payer" id="payer"></div>
      <div class="seg" id="dseg"></div>
    </div>
    <input class="date-in" id="date-in" type="date" onchange="rCap()">
    <div class="keypad" id="keypad"></div>
    <button class="save" id="save" onclick="submitExp()" disabled></button>
  </div>
</section>

<!-- ── Journal ── -->
<section id="v-journal" class="view">
  <header class="top"><h1>Journal 2026</h1></header>
  <div class="ycard" id="ycard"></div>
  <div id="months"></div>
</section>

<!-- ── Liste ── -->
<section id="v-liste" class="view">
  <header class="top"><h1>Liste</h1><span class="sub" id="li-sub"></span></header>
  <div class="add">
    <input id="li-input" type="text" placeholder="Ajouter un article…" enterkeyhint="done" onkeydown="if(event.key==='Enter')addItem()">
    <button onclick="addItem()" aria-label="Ajouter">+</button>
  </div>
  <div class="chips add-stores" id="li-stores"></div>
  <div id="li-groups"></div>
</section>

<nav class="tabbar">
  <button class="tab on" data-v="saisir" onclick="go('saisir')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>Saisir</button>
  <button class="tab" data-v="journal" onclick="go('journal')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 6h14M5 12h14M5 18h9"/></svg>Journal</button>
  <button class="tab" data-v="liste" onclick="go('liste')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6h15l-1.5 9h-12z"/><path d="M6 6L5 3H2"/><circle cx="9" cy="20" r="1.3"/><circle cx="18" cy="20" r="1.3"/></svg>Liste<span class="badge" id="badge" hidden></span></button>
</nav>

<div class="toast" id="toast"><span id="toast-msg"></span><button id="toast-undo">Annuler</button></div>

<div class="sheet-bg" id="who-sheet">
  <div class="sheet">
    <h2>Qui utilise ce téléphone ?</h2>
    <p>Vos dépenses seront attribuées à cette personne par défaut. Vous pourrez toujours choisir l'autre au moment de la saisie.</p>
    <div class="who"><button class="a" onclick="setMe(0)">Audrey</button><button class="t" onclick="setMe(1)">Tom</button></div>
  </div>
</div>

<script>
const MONTHS=['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
const MSHORT=['Jan','Fév','Mar','Avr','Mai','Jui','Jul','Aoû','Sep','Oct','Nov','Déc'];
const P=['Audrey','Tom'];
const ABBR={'Bioveyre':'BV','Carrefour':'CF','Picard':'PIC','Malongo':'MAL','Leclerc':'LEC','Biocoop':'BIO','Autres':'···','Set Squash':'SS'};
const KNOWN=['Bioveyre','Carrefour','Picard','Malongo','Leclerc','Biocoop','Autres'];
const STORE_STYLE={
  'Bioveyre':['#EEF3EF','#4F6E55'],
  'Carrefour':['#EDF1F5','#4A6785'],
  'Picard':['#F0EFF5','#5F5A80'],
  'Malongo':['#F5F1E8','#7D6640'],
  'Leclerc':['#F6EEEA','#8E5A48'],
  'Biocoop':['#ECF3F2','#4C7470'],
  'Autres':['#F0F0EC','#6F7672'],
};
function tagStyle(s){return STORE_STYLE[s]||['#F0F0EC','#6F7672'];}

const PANDA=`<svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#3E93B8"/><stop offset="100%" stop-color="#46A886"/></linearGradient></defs>
  <rect x="4" y="4" width="72" height="72" rx="22" fill="url(#bg)"/>

  <g transform="translate(40 37)">
    <circle cx="-16" cy="-15" r="8" fill="#26363A"/><circle cx="16" cy="-15" r="8" fill="#26363A"/>

    <circle cx="-8" cy="-1" r="2.4" fill="#fff"/><circle cx="8" cy="-1" r="2.4" fill="#fff"/>

    <path d="M0 11 Q0 14.5 -3.5 15.5 M0 11 Q0 14.5 3.5 15.5" fill="none" stroke="#26363A" stroke-width="1.4" stroke-linecap="round"/>
  </g>
  <g transform="translate(52 54)">
    <circle cx="6" cy="6" r="13" fill="#fff"/>
    <path d="M-1 -1 h11 l-1.5 7 h-7 z" fill="none" stroke="#368A6D" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M-1 -1 l-2.5 -1.5" fill="none" stroke="#368A6D" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="2" cy="8.5" r="1.4" fill="#2F7A9B"/><circle cx="8" cy="8.5" r="1.4" fill="#2F7A9B"/>
  </g></svg>`;

const SEED=[
  {id:1,store:'Bioveyre',amount:40,partner:0,date:'2026-01-06'},{id:2,store:'Carrefour',amount:60,partner:1,date:'2026-01-03'},
  {id:3,store:'Bioveyre',amount:40,partner:1,date:'2026-01-09'},{id:4,store:'Carrefour',amount:30,partner:1,date:'2026-01-10'},
  {id:5,store:'Malongo',amount:100,partner:0,date:'2026-01-12'},{id:6,store:'Picard',amount:60,partner:0,date:'2026-01-12'},

const SEED_V=2;
let st={exp:[...SEED],vir:{0:true,1:true,2:true,3:true,4:true,5:true,6:true},nextId:87,seedV:SEED_V,sel:0,vm:6,list:[],listId:1};
let editId=null;

function save(){localStorage.setItem('pandacourses',JSON.stringify(st));}
function load(){const d=localStorage.getItem('pandacourses');if(d)st=JSON.parse(d);if(!st.list)st.list=[];if(!st.listId)st.listId=1;mergeSeed();}
// Ajoute aux données déjà enregistrées les dépenses du Sheet qui n'y sont pas encore
function mergeSeed(){
  if((st.seedV||1)>=SEED_V)return;
  const k=e=>e.date+'|'+e.store+'|'+e.amount+'|'+e.partner,have=new Set(st.exp.map(k));
  SEED.forEach(e=>{if(!have.has(k(e))){st.exp.push({...e,id:st.nextId++});have.add(k(e));}});
  [4,5,6].forEach(i=>{if(st.vir[i]===undefined)st.vir[i]=true;});
  st.seedV=SEED_V;save();
}

// ── Outils ──
function cm(){return new Date().getMonth();}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function today(){return iso(new Date());}
function yesterday(){const d=new Date();d.setDate(d.getDate()-1);return iso(d);}
function monExp(m){const k=String(m+1).padStart(2,'0');return st.exp.filter(e=>e.date.slice(5,7)===k);}
function pTot(m,p){return monExp(m).filter(e=>e.partner===p).reduce((s,e)=>s+e.amount,0);}
function eq(m){const a=pTot(m,0),t=pTot(m,1),tot=a+t;return{a,t,tot,d:a-tot/2};}
function fs(n){return Math.round(n*100)%100===0?Math.round(n)+' €':n.toFixed(2).replace('.',',')+' €';}
function abbr(s){if(ABBR[s])return ABBR[s];if(s.includes(','))return s.split(',').map(x=>ABBR[x.trim()]||x.trim().slice(0,2).toUpperCase()).join('/');return s.slice(0,3).toUpperCase();}
function pc(p){return p===0?'a':'t';}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function dayLabel(ds){const d=new Date(ds+'T12:00');const s=d.toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'});return ds===today()?"Aujourd'hui":ds===yesterday()?'Hier':s;}
// Phrase d'équilibre : d>0 → Audrey a payé plus, Tom lui doit d
function owes(d){if(Math.abs(d)<0.01)return null;return d>0?{from:'Tom',to:'Audrey',amt:d}:{from:'Audrey',to:'Tom',amt:-d};}

function setMe(p){me=p;try{localStorage.setItem('pandacourses-me',String(p));}catch(e){}document.getElementById('who-sheet').classList.remove('on');if(editId===null)c.payer=p;rSaisir();}

}

// ── Saisir ──
const c={amt:'',store:null,other:'',payer:0,dmode:'today',date:today()};
function storeOrder(){
  const n={};st.exp.forEach(e=>{n[e.store]=(n[e.store]||0)+1;});
  return KNOWN.filter(s=>s!=='Autres').sort((a,b)=>(n[b]||0)-(n[a]||0));
}
function amtNum(){return c.amt?parseFloat(c.amt.replace(',','.')):0;}
function rBal(){
  const m=cm(),e=eq(m),o=owes(e.d),pa=e.tot?e.a/e.tot*100:50;
  document.getElementById('bal').innerHTML=`
    <div class="bal-head"><div class="bal-title">${o?`${o.from} doit <span class="num">${fs(o.amt)}</span> à ${o.to}`:'Tout est carré ce mois-ci'}</div><span class="bal-more">${MONTHS[m]} ›</span></div>
    <div class="bal-bar">${e.tot?`<div class="a" style="width:${pa}%"></div><div class="t" style="width:${100-pa}%"></div>`:''}<div class="mid"></div></div>
    <div class="bal-legend num"><span><span class="dot a"></span>Audrey ${fs(e.a)}</span><span>${fs(e.tot)} au total</span><span>Tom ${fs(e.t)}<span class="dot t" style="margin:0 0 0 5px"></span></span></div>`;
}
function rAmt(){
  const el=document.getElementById('amt-val');
  el.textContent=(c.amt||'0')+' €';el.classList.toggle('zero',!c.amt);
}
function rCap(){
  const d=c.dmode==='other'?document.getElementById('date-in').value:c.date;
  document.getElementById('amt-cap').textContent=d?`${dayLabel(d)} · payé par ${P[c.payer]}`:'';
  rSave();
}
function rStores(){
  const chips=storeOrder().map(s=>`<button class="chip ${c.store===s?'on':''}" onclick="pickStore('${s}')">${s}</button>`).join('')
    +`<button class="chip ${c.store==='__other'?'on':''}" onclick="pickStore('__other')">Autre…</button>`;
  document.getElementById('store-chips').innerHTML=chips;
  document.getElementById('other-in').classList.toggle('on',c.store==='__other');
}
function rPayer(){
  document.getElementById('payer').innerHTML=P.map((n,i)=>`<button class="${pc(i)} ${c.payer===i?'on':''}" onclick="c.payer=${i};rPayer();rCap()">${n}</button>`).join('');
}
function rDate(){
  const opts=[['today','Auj.'],['yesterday','Hier'],['other','Autre']];
  document.getElementById('dseg').innerHTML=opts.map(([k,l])=>`<button class="${c.dmode===k?'on':''}" onclick="pickDate('${k}')">${l}</button>`).join('');
  document.getElementById('date-in').classList.toggle('on',c.dmode==='other');
}
function rKeypad(){
  const k=['1','2','3','4','5','6','7','8','9',',','0','⌫'];
  document.getElementById('keypad').innerHTML=k.map(x=>`<button class="key ${x===','||x==='⌫'?'fn':''}" onclick="press('${x}')">${x}</button>`).join('');
}
function rSave(){
  const b=document.getElementById('save'),n=amtNum();
  const storeOk=c.store&&(c.store!=='__other'||document.getElementById('other-in').value.trim());
  const dateOk=c.dmode!=='other'||document.getElementById('date-in').value;
  b.disabled=!(n>0&&storeOk&&dateOk);
  b.textContent=!n?'Saisir un montant':!storeOk?'Choisir un magasin':!dateOk?'Choisir une date':editId!==null?'Enregistrer les modifications':`Enregistrer ${fs(n)}`;
}
function rSaisir(){
  document.getElementById('me-btn').innerHTML=me===null?'Qui êtes-vous ?':`Téléphone de <b>${P[me]}</b>`;
  rBal();rAmt();rStores();rPayer();rDate();rCap();
}
function press(k){
  let a=c.amt;
  if(k==='⌫')a=a.slice(0,-1);
  else if(k===','){if(!a.includes(','))a=(a||'0')+',';}
  else{
    if(a.includes(',')&&a.split(',')[1].length>=2)return;
    if(a.replace(',','').length>=6)return;
    a=(a==='0'?'':a)+k;
  }
  c.amt=a;rAmt();rSave();
}
function pickStore(s){c.store=s;rStores();if(s==='__other')document.getElementById('other-in').focus();rSave();}
function pickDate(k){
  c.dmode=k;
  if(k==='today')c.date=today();else if(k==='yesterday')c.date=yesterday();
  else{const di=document.getElementById('date-in');if(!di.value)di.value=today();}
  rDate();rCap();
}
function resetComposer(){
  c.amt='';c.store=null;c.payer=me??0;c.dmode='today';c.date=today();
  document.getElementById('other-in').value='';document.getElementById('date-in').value='';
  editId=null;document.getElementById('edit-banner').classList.remove('on');
}
function submitExp(){
  const n=amtNum();if(!(n>0)||!c.store)return;
  const date=c.dmode==='other'?document.getElementById('date-in').value:c.date;if(!date)return;
  const otherTxt=document.getElementById('other-in').value.trim();
  let store=c.store,comment;
  if(store==='__other'){store='Autres';comment=otherTxt;}
  if(editId!==null){
    const e=st.exp.find(x=>x.id===editId);
    // Un magasin hors liste (ex. « Carrefour, Bioveyre ») resté inchangé garde son nom d'origine
    if(e&&c.store==='__other'&&!KNOWN.includes(e.store)&&otherTxt===e.store){store=e.store;comment=e.comment;}
    if(e){e.store=store;e.amount=n;e.date=date;e.partner=c.payer;if(comment)e.comment=comment;else delete e.comment;}
    save();resetComposer();rSaisir();toast('Dépense modifiée');go('journal');return;
  }
  const e={id:st.nextId++,store,amount:n,date,partner:c.payer};if(comment)e.comment=comment;
  st.exp.push(e);save();
  const label=comment||store;
  resetComposer();rSaisir();
  toast(`${fs(n)} · ${label} ajouté`,()=>{st.exp=st.exp.filter(x=>x.id!==e.id);save();rSaisir();});
}

// Modifier : seules les dépenses du mois en cours sont modifiables

function openEdit(id){
  const e=st.exp.find(x=>x.id===id);if(!e)return;
  editId=id;
  c.amt=String(e.amount).replace('.',',');c.payer=e.partner;
  const t=e.date===today()?'today':e.date===yesterday()?'yesterday':'other';
  c.dmode=t;c.date=e.date;document.getElementById('date-in').value=t==='other'?e.date:'';
  if(KNOWN.includes(e.store)&&e.store!=='Autres'){c.store=e.store;document.getElementById('other-in').value='';}
  else{c.store='__other';document.getElementById('other-in').value=e.store==='Autres'?(e.comment||''):e.store;}
  document.getElementById('edit-label').textContent=`Modifier · ${abbr(e.store)} du ${dayLabel(e.date).toLowerCase()}`;
  document.getElementById('edit-banner').classList.add('on');
  go('saisir');
}
function cancelEdit(){resetComposer();rSaisir();go('journal');}
function delEditing(){
  if(editId===null)return;
  const e=st.exp.find(x=>x.id===editId);
  st.exp=st.exp.filter(x=>x.id!==editId);save();resetComposer();rSaisir();
  toast('Dépense supprimée',()=>{st.exp.push(e);save();rJournal();});
  go('journal');
}

// ── Journal ──
const openM=new Set([cm()]);
function rJournal(){
  const now=cm(),tots=MONTHS.map((_,i)=>eq(i).tot),yr=tots.reduce((s,v)=>s+v,0),mx=Math.max(...tots,1);
  document.getElementById('ycard').innerHTML=`
    <div class="ycard-head"><div><div class="sub">Dépensé depuis janvier</div><div class="ycard-total num">${fs(yr)}</div></div>
      <div class="sub" style="text-align:right">moyenne<br><b class="num" style="color:var(--ink)">${fs(Math.round(yr/(now+1)))}</b> / mois</div></div>
    <div class="bars">${tots.map((v,i)=>`<button onclick="jump(${i})" ${i>now?'disabled':''} aria-label="${MONTHS[i]}"><div class="b ${i===now?'cur':''}" style="height:${i>now?0:Math.max(v/mx*100,3)}%"></div><span class="l">${MSHORT[i][0]}</span></button>`).join('')}</div>`;
  let h='';
  for(let i=now;i>=0;i--){
    const ex=monExp(i);if(!ex.length&&i!==now)continue;
    const e=eq(i),o=owes(e.d),cur=i===now;
    const pill=!o?'':cur?'<span class="vir cur">en cours</span>':`<button class="vir ${st.vir[i]?'done':'todo'}" onclick="event.stopPropagation();tglV(${i})">${st.vir[i]?'✓ Virement fait':'Virement à faire'}</button>`;
    const days={};ex.sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id).forEach(x=>{(days[x.date]=days[x.date]||[]).push(x);});
    const body=Object.keys(days).map(d=>`<div class="day">${dayLabel(d)}</div>`+days[d].map(x=>{
      const nm=esc(x.comment?`${x.store==='Autres'?'':x.store+' — '}${x.comment}`:x.store);
      return `<${cur?'button':'div'} class="row ${cur?'ed':''}" ${cur?`onclick="openEdit(${x.id})"`:''}>
        <div class="row-ic ${pc(x.partner)}">${esc(abbr(x.store))}</div>
        <div class="row-main"><div class="row-name">${nm}</div><div class="row-who">${P[x.partner]}</div></div>
        <div class="row-amt num">${fs(x.amount)}</div></${cur?'button':'div'}>`;}).join('')).join('');
    h+=`<div class="month ${openM.has(i)?'open':''}" id="m-${i}">
      <div class="m-head" role="button" tabindex="0" onclick="tglM(${i})">
        <div class="m-row"><span class="m-name">${MONTHS[i]}<span class="chev">›</span></span><span class="m-total num">${fs(e.tot)}</span></div>
        <div class="m-meta"><span>${o?`${o.from} → ${o.to} · <span class="num">${fs(o.amt)}</span>`:(e.tot?'Équilibré':'Aucune dépense')}</span>${pill}</div>
      </div>
      <div class="m-body">${body||''}<div class="m-foot num"><span class="dot a"></span>Audrey ${fs(e.a)} · <span class="dot t"></span>Tom ${fs(e.t)}${cur&&ex.length?' · touchez une dépense pour la modifier':''}</div></div>
    </div>`;
  }
  document.getElementById('months').innerHTML=h;
}
function tglM(i){openM.has(i)?openM.delete(i):openM.add(i);document.getElementById('m-'+i).classList.toggle('open');}
function tglV(i){st.vir[i]=!st.vir[i];save();rJournal();}
function jump(i){openM.add(i);rJournal();const el=document.getElementById('m-'+i);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});}

  const g={};active.forEach(i=>{(g[i.store||'']=g[i.store||'']||[]).push(i);});
  const order=[...KNOWN.filter(s=>g[s]),...Object.keys(g).filter(s=>s&&!KNOWN.includes(s)).sort(),...(g['']?['']:[])];
  const row=i=>`<div class="it ${i.done?'done':''}">
    <button class="it-check" onclick="tglItem(${i.id})" aria-label="Cocher">${i.done?'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>':''}</button>

    ${i.done?'':`<button class="it-star ${i.important?'on':''}" onclick="tglImp(${i.id})" aria-label="Important">★</button>`}
    <button class="it-del" onclick="delItem(${i.id})" aria-label="Supprimer">✕</button></div>`;
  let h=order.map(s=>{const its=g[s].sort((a,b)=>(b.important?1:0)-(a.important?1:0));
    return `<div class="group"><div class="g-head"><span class="g-name">${esc(s||'Sans magasin')}</span><span class="g-count">${its.length}</span></div><div class="g-body">${its.map(row).join('')}</div></div>`;}).join('');
  if(done.length)h+=`<div class="basket-head"><span class="g-name">Dans le panier · ${done.length}</span><button onclick="clearDone()">Tout retirer</button></div><div class="g-body">${done.map(row).join('')}</div>`;
  if(!st.list.length)h='<div class="empty">La liste est vide.<br>Ajoutez ce qui manque à la maison,<br>et rangez-le par magasin.</div>';
  else if(!active.length)h='<div class="empty">Tout est pris 🎉</div>'+h;
  document.getElementById('li-groups').innerHTML=h;
  rBadge();
}
function rBadge(){const n=st.list.filter(i=>!i.done).length,b=document.getElementById('badge');b.hidden=!n;b.textContent=n;}
function addItem(){
  const inp=document.getElementById('li-input'),t=inp.value.trim();if(!t)return;
  st.list.push({id:st.listId++,text:t,done:false,store:liStore});
  inp.value='';save();rList();inp.focus();
}
function tglItem(id){const i=st.list.find(x=>x.id===id);if(i){i.done=!i.done;save();rList();}}
function tglImp(id){const i=st.list.find(x=>x.id===id);if(i){i.important=!i.important;save();rList();}}
function delItem(id){st.list=st.list.filter(x=>x.id!==id);save();rList();}
function clearDone(){const kept=st.list.filter(i=>i.done);st.list=st.list.filter(i=>!i.done);save();rList();toast(`${kept.length} article${kept.length>1?'s':''} retiré${kept.length>1?'s':''}`,()=>{st.list.push(...kept);save();rList();});}

// ── Toast avec « Annuler » ──
let toastT=null;
function toast(msg,undo){
  const el=document.getElementById('toast'),u=document.getElementById('toast-undo');
  document.getElementById('toast-msg').textContent=msg;
  u.hidden=!undo;u.onclick=()=>{el.classList.remove('on');undo&&undo();};
  el.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('on'),4000);
}

// ── Démarrage ──
load();
document.getElementById('logo').innerHTML=PANDA;
c.payer=me??0;rKeypad();rSaisir();rBadge();
if(me===null)openWho();
